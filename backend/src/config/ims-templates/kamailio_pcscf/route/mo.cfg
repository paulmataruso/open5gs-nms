######################################################################
# Originating, Intial Requests
######################################################################
route[MO]
{
	# Strip Transport from RURI:
	$ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

	# Real bug, confirmed live (2026-07-31): ims_ipsec_pcscf's fill_contact()
	# does NOT look at a reply's own Contact header at all for SIP_REPLY
	# messages - it re-parses t->uas.request (the ORIGINAL REQUEST stored in
	# the transaction) and hard-fails ("Reply No contact headers") if THAT
	# has no usable Contact. RFC 3428 doesn't require MESSAGE requests to
	# carry a Contact header (unlike REGISTER/INVITE), and real phones often
	# omit it - so every reply to a Contact-less MO MESSAGE was failing at
	# ipsec_forward() and never reaching the UE, no matter what the reply
	# side (onreply_route[MO_reply]) does. The onreply_route fix that
	# preceded this one is still worth keeping (it's the general Contact
	# repair for outgoing replies), but it cannot fix this - the request
	# itself must have a Contact header BEFORE it's relayed upstream and
	# captured into the transaction. Fixing here, before loose_route()/
	# relay, is the actual fix.
	if (!is_present_hf("Contact")) {
		append_hf("Contact: <sip:$Ri:$Rp>\r\n");
	}

	# Process route headers, if any:
	loose_route();
	if (!pcscf_is_registered("pcscf_location")) {
		send_reply("403","Forbidden - You must register first with a S-CSCF");
		exit;
	}

	# We do not trust the user, let's remove the P-Asserted-Identity, if any:
	remove_hf("P-Asserted-Identity");
	remove_hf("P-Preferred-Identity");

	# Add P-Charging-Vector
	sip_p_charging_vector("g");

	if (is_present_hf("P-Preferred-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Preferred-Identity)") && $hdr(P-Preferred-Identity) =~ "sip:.*") {
		append_hf("P-Asserted-Identity: $hdr(P-Preferred-Identity)\r\n");
	} else if (is_present_hf("P-Asserted-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Asserted-Identity)") && $hdr(P-Asserted-Identity) =~ "sip:.*") {
		append_hf("P-Asserted-Identity: $hdr(P-Asserted-Identity)\r\n");
	} else if (pcscf_assert_identity("pcscf_location", "$(fu{tobody.uri})")) {
		# For broken SIP implementation in Samsung devices
		if ($fu =~ "tel:.*") {
			$var(new_hdr) = $(fu{tobody.uri}) + "@NETWORKNAME";
			$var(new_hdr) = $(var(new_hdr){re.subst,/tel:/sip:/g});
			append_hf("P-Asserted-Identity: <$var(new_hdr)>\r\n");
			$fu = $var(new_hdr);
		} else {
			append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
		}
	} else {
		append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
	}

	if (!pcscf_follows_service_routes("pcscf_location")){
		#Variant 1 - deny access to the network
		#send_reply("400","Bad Request - Not following indicated service routes");
		#break;

		#Variant 2 - enforce routes and let the dialog continue
		pcscf_force_service_routes("pcscf_location");
	}

	# add IBCF/THIG route here if required
	# Check for "sec-agree" in the Require header:
	if (is_present_hf("Require") && $hdr(Require) =~ ".*sec-agree.*") {
		# Remove the old Require-Header:
		remove_hf("Require");
		# Replace ", sec-agree" with ""
		$var(new_hdr) = $(hdr(Require){re.subst,/[, ]*sec-agree//gi});
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Require: $var(new_hdr)\r\n");
		}
	}

	# Check for "sec-agree" in the Proxy-Require header:
	if (is_present_hf("Proxy-Require") && $hdr(Proxy-Require) =~ ".*sec-agree.*") {
		# Remove the old Proxy-Require-Header:
		remove_hf("Proxy-Require");
		# Replace ", sec-agree" with ""
		$var(new_hdr) = $(hdr(Proxy-Require){re.subst,/[, ]*sec-agree//gi});
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Proxy-Require: $var(new_hdr)\r\n");
		}
	}
	remove_hf("Security-Verify");

#!ifdef TRF_FUNCTION
	$var(trf) = TRF_FUNCTION;
	# Check for "sec-agree" in the Proxy-Require header:
	if (is_present_hf("Feature-Caps")) {
		# Remove the old Proxy-Require-Header:
		remove_hf("Feature-Caps");
		append_hf("Feature-Caps: $hdr(Feature-Caps);+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
	} else {
		append_hf("Feature-Caps: *;+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
	}
#!endif
	# Add a visited Network-ID-Header:
	if (is_present_hf("P-Visited-Network-ID")) {
		$var(new_hdr) = "NETWORKNAME, "+$hdr(P-Visited-Network-ID);
		append_hf("P-Visited-Network-ID: $var(new_hdr)\r\n");
	} else {
		append_hf("P-Visited-Network-ID: NETWORKNAME\r\n");
	}
	set_dlg_profile("orig");
	t_on_reply("MO_reply");
}

######################################################################
# Replies to Originating Initial Requests
######################################################################
onreply_route[MO_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");
	if (is_present_hf("C-Params")) {
		remove_hf("Contact");
		remove_hf("C-Params");
		append_hf("Contact: $ct;$hdr(C-Params)\r\n");
	} else {
		# Real bug, confirmed live (2026-07-31): a locally-originated 1xx/2xx
		# reply with no usable Contact header at all (e.g. an AS's 202
		# Accepted to a MESSAGE - it has no C-Params concept, that's
		# REGISTER-binding specific) previously fell through this whole
		# block untouched, then ipsec_forward() below failed outright -
		# fill_contact(): "Reply No contact headers" / ipsec_forward():
		# "Error filling in contact data" - and the reply was silently
		# never relayed back through the UE's IPsec tunnel at all. The UE
		# got no response, retransmitted (confirmed via S-CSCF's own
		# "Transaction ... exists. Retransmission?" log) until it gave up -
		# this is what a real MO SMS "not working" actually was.
		#
		# First attempt at this fix only added a Contact header when one
		# was COMPLETELY absent (is_present_hf("Contact") check) - wrong:
		# confirmed live that fill_contact() can still reject a reply that
		# technically has *a* Contact header if it's not one the module
		# considers usable, so gating on presence alone left it broken.
		# Unconditional remove+replace, exactly mirroring what the
		# C-Params branch above already does successfully for REGISTER
		# replies, is the actual fix - always guarantee a known-good
		# Contact header right before ipsec_forward() regardless of
		# whatever arrived from upstream. Same underlying ims_ipsec_pcscf
		# weakness as the already-known Android->iPhone PRACK bug - this is
		# the one onreply_route every MO reply (any method, not just
		# MESSAGE) actually funnels through, so fixing it here is the real,
		# general fix rather than patching each individual
		# reply-generating route one at a time.
		remove_hf("Contact");
		append_hf("Contact: <sip:$Ri:$Rp>\r\n");
	}

#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]") {
		route(NATMANAGE);
		# Real bug, confirmed live 2026-10-04: rtpengine_manage() (inside
		# NATMANAGE, the "mo side Asterisk B2BUA answer" branch) replaces
		# this reply's SDP body with its own 1010-facing relay address, but
		# that replacement doesn't invalidate Kamailio's already-cached SDP
		# parse -- so the N5 code below, which reads the audio port via
		# $sdp(body), was reading the STALE pre-rewrite value (Asterisk's
		# own internal port on the Asterisk-facing leg) instead of the real
		# rtpengine port actually advertised back to the real UE. The N5
		# QoS flow authorization's own "permit ... to <ip> <port>" ended up
		# authorizing a destination port the UE's traffic was never
		# actually addressed to -- confirmed live this silently blocks a
		# real UE's own uplink media on a cross-RAN call (PCF/UPF/RAN
		# enforce the authorized flow; audio arriving at any other port
		# never reaches this host at all, with zero error anywhere in
		# Kamailio/rtpengine/Asterisk, since none of them are where the
		# drop happens). msg_apply_changes() here is safe for a reply --
		# confirmed earlier tonight against real source that
		# sip_msg_apply_changes() takes a completely different, dest_info_t
		# -free path for SIP_REPLY messages (generate_res_buf_from_sip_res())
		# than the null-send_sock-prone request path. Forces a fresh
		# reparse so $sdp(body) below reflects what rtpengine actually
		# wrote.
		msg_apply_changes();
	}

	if (t_check_status("180|183|200") && has_body("application/sdp")) {
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		# Real bug, confirmed live 2026-10-05: same race as mt.cfg's
		# onreply_route[MT_reply] (see that file's comment for the full
		# mechanism) -- this block had no guard against re-running on every
		# retransmitted 183, each one re-dispatching a fresh Rx_AAR -> N5
		# fallback round trip. Guarded the same way, sharing the same lock
		# table -- Rx AAR authorization for this leg is one logical event,
		# dispatched at most once per dialog.
		sht_lock("rtp_manage_lock=>mo_aar_lock");
		$var(do_mo_aar) = 0;
		if ($dlg_var(mo_aar_dispatched) == $null) {
			$dlg_var(mo_aar_dispatched) = "1";
			$var(do_mo_aar) = 1;
		}
		sht_unlock("rtp_manage_lock=>mo_aar_lock");
		if ($var(do_mo_aar) == 1) {
			xlog("L_DBG", "IMS: Received 183/200 inside orig_initial_reply\n");
			xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
			if (Rx_AAR("MO_aar_reply","orig","",-1) == 0) {
#!ifdef WITH_N5
				xlog("L_WARN", "IMS: Rx_AAR dispatch failed for MO leg — falling back to N5\n");
				route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
				exit;
			}
		} else {
			xlog("L_DBG", "IMS: MO leg Rx AAR already dispatched for this dialog — skipping duplicate (retransmitted reply)\n");
		}
#!else
#!ifdef WITH_N5
		route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
#!endif
	}
}

#!ifdef WITH_RX
route[MO_aar_reply]
{
	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
		case 1:
			xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
			break;
		default:
			xlog("L_ERR", "IMS: AAR failed Orig\n");
			xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
#!ifdef WITH_N5
			# Real bug, confirmed live 2026-09-29 — see the matching comment in
			# mt.cfg's MT_aar_reply for the full explanation: a 5G/NR UE's own
			# PDU session policy lives entirely in PCF, never PCRF, so Rx can
			# never succeed for that leg. Fall back to N5 instead of
			# terminating; a 4G leg's Rx AAR still succeeds normally above and
			# never reaches here.
			xlog("L_WARN", "IMS: Rx AAR failed for MO leg — falling back to N5 PCF policy authorization\n");
			route(MO_N5_CALL_PCF_POLICY_AUTH);
			exit;
#!else
			# Comment this if you want to allow even if Rx fails
			if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
				dlg_terminate("all", "Sorry no QoS available");
				exit;
			}
#!endif
	}
}
#!endif

######################################################################
# In-Dialog-Mo-Requests
######################################################################
route[MO_indialog] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after BYE/CANCEL.
	if (is_method("BYE|CANCEL")) {
		xnotice("InDialog Call End/Cancel/Error. Terminating N5 QoS Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

	setflag(FLT_MOBILE_ORIG);
	t_on_reply("MO_indialog_reply");

	# Append rport only if its a request coming from UE
	if (is_request() && ($hdrc(Via) == 1)) {
		force_rport();
	}

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
}

onreply_route[MO_indialog_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]") {
		# Real bug, confirmed live 2026-09-29 — see the matching fix + full comment
		# in mt.cfg's own MT_indialog_reply for the complete mechanism (same
		# critic-caught gap in the same-day rtp.cfg offer/answer fix, mirrored
		# here for the MO leg). Deliberately using t_is_retr_async_reply()
		# (transaction-scoped) rather than a $dlg_var latch (dialog-scoped) —
		# a dialog can legitimately need multiple real in-dialog offer/answers
		# (Hold, Resume, codec change), so a permanent latch would wrongly
		# suppress every one after the first.
		if ((t_check_status("180|183|200") && has_body("application/sdp") && !is_method("PRACK")) || is_method("UPDATE")) {
			if (t_is_retr_async_reply()) {
				xlog("L_DBG", "Dropping retransmitted in-dialog reply before NATMANAGE — would double-register with rtpengine\n");
				drop();
			}
		}
		route(NATMANAGE);
		# Real bug, confirmed live 2026-10-04 — same stale-SDP-cache mechanism
		# as the matching fix in orig_initial_reply above (see that comment
		# for the full root cause), mirrored here for the in-dialog leg
		# (Hold/Resume/UPDATE/codec renegotiation). msg_apply_changes() forces
		# a reparse so the N5 code below reads rtpengine's real rewritten port,
		# not the stale pre-rewrite one.
		msg_apply_changes();
	}

	if ((t_check_status("180|183|200") && has_body("application/sdp") && !is_method("PRACK")) || (is_method("UPDATE"))) {
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		xlog("L_DBG", "IMS: ORIG_SUBSEQUENT reply. This is a 200 OK to a re-INVITE\n");
		xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
		# Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
		if (Rx_AAR("MO_indialog_aar_reply","orig","",-1) == 0) {
#!ifdef WITH_N5
			xlog("L_WARN", "IMS: Rx_AAR dispatch failed for in-dialog MO leg — falling back to N5\n");
			route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
			exit;
		}
#!else
#!ifdef WITH_N5
		route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
#!endif
	}
}

#!ifdef WITH_RX
route[MO_indialog_aar_reply]
{
	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
	case 1:
		xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
		break;
	default:
		xlog("L_ERR", "IMS: AAR failed Orig\n");
		xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
		xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
		xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
#!ifdef WITH_N5
		# Same real bug class as MO_aar_reply (see its own comment) — a
		# 5G/NR UE's in-dialog Rx AAR (Hold/Resume/re-INVITE on an
		# already-connected call) can never succeed either, for the
		# identical reason. Fall back to N5 instead of terminating an
		# otherwise-healthy in-dialog request.
		xlog("L_WARN", "IMS: Rx AAR failed for in-dialog MO leg — falling back to N5 PCF policy authorization\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH);
		exit;
#!else
		# Comment this if you want to allow even if Rx fails
		if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
			dlg_terminate("all", "Sorry no QoS available");
			exit;
		}
#!endif
	}
}
#!endif

#!ifdef WITH_N5
route[MO_N5_CALL_PCF_POLICY_AUTH] {
	# Send N5 PCF policy authorization only on replies.
	if (!is_reply()) {
		return;
	}
	# Authorize N5 policy at most once per (Call-ID, CSeq) -- see the
	# n5_auth_dedup htable's own comment in kamailio_pcscf.cfg for the full
	# root cause. Keyed on CSeq rather than just Call-ID so a genuine mid-call
	# renegotiation (re-INVITE/UPDATE for hold/resume or a codec change) still
	# gets its own PATCH, which is the whole point of the AppSession reuse
	# lifecycle -- only the duplicate leg traversal of ONE reply is suppressed.
	#
	# $sht() is compared directly rather than via $var(): assigning a $null
	# $sht() into a $var() stores integer 0 (pv_core.c:3105-3112), which is the
	# exact defect that broke the AppSession teardown, so it is avoided here
	# rather than reintroduced. ht_slot_lock is per-process re-entrant
	# (ht_api.c:149-176), so locking this table's own key and then reading and
	# writing it inside the lock is deadlock-free.
	$var(n5_do_auth) = 0;
	sht_lock("n5_auth_dedup=>$ci");
		if ($sht(n5_auth_dedup=>$ci) != $cs) {
			$sht(n5_auth_dedup=>$ci) = $cs;
			$var(n5_do_auth) = 1;
		}
	sht_unlock("n5_auth_dedup=>$ci");
	if ($var(n5_do_auth) == 0) {
		xlog("L_INFO", "IMS: N5 policy authorization already issued for Call-Id $ci CSeq $cs — skipping duplicate leg traversal (would PATCH over a correct PCC rule)\n");
		return;
	}
	$var(contact_uri) = $T_req($(ct{nameaddr.uri}));
	$var(ue_ip) = $(var(contact_uri){uri.host});

	# AppSession-ID reuse lookup, reinstated 2026-10-02 now that this host's
	# Kamailio is genuinely 6.0.8 ($httprhdr(...)/response_headers are real,
	# current API there — see the matching comment further down). A Call-Id
	# already present here means a prior SDP exchange on THIS call already
	# created a real N5 AppSession on PCF — reuse it via PATCH instead of
	# POSTing a brand new one on every re-INVITE/UPDATE (Hold/Resume/codec
	# change), and give MO_N5_CALL_PCF_POLICY_AUTH_DELETE below something
	# real to terminate at call end instead of being a permanent no-op (see
	# memory kamailio_6_source_build_progress.md's 2026-10-02 addendum for
	# the real bearer-retention bug this fixes).
	# Real bug, confirmed live 2026-10-03: Kamailio's != $null check does
	# NOT catch an empty-but-non-null string value stored in the htable --
	# a real, observed garbage/empty entry was treated as a real existing
	# AppSession ID, producing a PATCH to a bogus path ("/app-sessions/0"
	# or similar) that PCF correctly rejects as Not Found, breaking the
	# call instead of falling back cleanly to a fresh POST. Now requires
	# BOTH the raw htable value AND the extracted ID to be non-empty
	# ({s.len} > 0) before trusting it.
	# Kamailio's $var() CANNOT hold null -- assigning $null stores integer 0
	# (pv_core.c:3105-3112), so `$var(x) != $null` is permanently TRUE and the
	# value stringifies as "0". That silently inverted every check here:
	# confirmed live, 96 bogus `PATCH /app-sessions/0` and 418 bogus
	# `DELETE /app-sessions/0` against PCF, and the AppSession DELETE never
	# once worked. The 2026-10-04 `{s.len} > 0` mitigation does not help --
	# "0" has length 1 -- and the "cross-worker htable race" it was built on
	# was a misdiagnosis: $sht() correctly returns $null, the 0 is manufactured
	# locally by the assignment.
	#
	# Fixed by dropping the null sentinel entirely: an explicit integer flag
	# plus a `!= "0"` guard. "0" is provably never a valid AppSession id --
	# Open5GS ids come from ogs_pool_index(), which is 1-based, and
	# ogs_pool_find() rejects <= 0 -- so rejecting it is exactly the peer's own
	# validity domain, and it stays correct even if a reference is missed.
	#
	# Deliberately NOT $vn(): $var(x) and $vn(x) are DIFFERENT variables held
	# in separate lists, and script vars are never reset between messages
	# (reset_vars() is defined but called nowhere in the tree), so a partial
	# rename would build a URL from a stale slot holding a PREVIOUS call's id
	# -- and those ids are small recycled integers, so it could be a live one.
	$var(n5_have_id) = 0;
	$var(n5_app_session_id) = "0";
	$var(n5_existing) = $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci);
	if ($(var(n5_existing){s.len}) > 0 && $var(n5_existing) != "0") {
		$var(n5_candidate_id) = $(var(n5_existing){s.select,0,;});
		if ($(var(n5_candidate_id){s.len}) > 0 && $var(n5_candidate_id) != "0") {
			$var(n5_app_session_id) = $var(n5_candidate_id);
			$var(n5_have_id) = 1;
		}
	}

	# Send N5 PCF policy authorization if SDP body is present.
	if (!has_body("application/sdp")) {
		return;
	}
	$var(req_sdp) = $T_req($sdp(body));
	$var(rep_sdp) = $sdp(body);
	xlog("L_INFO","Req SDP: $var(req_sdp)\n");
	xlog("L_INFO","Rep SDP: $var(rep_sdp)\n");

	$var(current_media) = "";
	$var(req_audio_rtp_port) = 0;
	$var(req_audio_rtcp_port) = 0;
	$var(req_video_rtp_port) = 0;
	$var(req_video_rtcp_port) = 0;
	$var(req_audio_rtcp_explicit) = 0;
	$var(req_video_rtcp_explicit) = 0;
	$var(audio_bw_as) = 0;
	$var(video_bw_as) = 0;

	# Split SDP into lines and iterate.
	$var(req_sdp_lines_count) = $(var(req_sdp){line.count});
	$var(req_sdp_line_num) = 0;
	while ($var(req_sdp_line_num) < $var(req_sdp_lines_count)) {
		$var(sdp_line) = $(var(req_sdp){line.at,$var(req_sdp_line_num)});
		# Check for audio media line: "m=audio <port>".
		if ($var(sdp_line) =~ "^m=audio ") {
			$var(current_media) = "audio";
			$var(req_audio_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for video media line: "m=video <port>".
		else if ($var(sdp_line) =~ "^m=video ") {
