	}
	if ($var(req_video_rtcp_explicit) != 1 && $var(req_video_rtp_port) > 0) {
		$var(req_video_rtcp_port) = $(var(req_video_rtp_port){s.int}) + 1;
	}

	$var(current_media) = "";
	$var(rep_audio_rtp_port) = 0;
	$var(rep_audio_rtcp_port) = 0;
	$var(rep_video_rtp_port) = 0;
	$var(rep_video_rtcp_port) = 0;
	$var(rep_audio_rtcp_explicit) = 0;
	$var(rep_video_rtcp_explicit) = 0;
	# Split SDP into lines and iterate.
	$var(rep_sdp_lines_count) = $(var(rep_sdp){line.count});
	$var(rep_sdp_line_num) = 0;
	while ($var(rep_sdp_line_num) < $var(rep_sdp_lines_count)) {
		$var(sdp_line) = $(var(rep_sdp){line.at,$var(rep_sdp_line_num)});
		# Check for audio media line: "m=audio <port>".
		if ($var(sdp_line) =~ "^m=audio ") {
			$var(current_media) = "audio";
			$var(rep_audio_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for video media line: "m=video <port>".
		else if ($var(sdp_line) =~ "^m=video ") {
			$var(current_media) = "video";
			$var(rep_video_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for explicit RTCP attribute: "a=rtcp:<port>".
		else if ($var(sdp_line) =~ "^a=rtcp:") {
			if ($var(current_media) == "audio") {
				$var(rep_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(rep_audio_rtcp_explicit) = 1;
			} else if ($var(current_media) == "video") {
				$var(rep_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(rep_video_rtcp_explicit) = 1;
			}
		}
		# Check for bandwidth information.
		else if ($var(sdp_line) =~ "^b=AS:") {
			if ($var(current_media) == "audio") {
				$var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
			} else if ($var(current_media) == "video") {
				$var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
			}
		}
		$var(rep_sdp_line_num) = $var(rep_sdp_line_num) + 1;
	}

	# Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
	if ($var(rep_audio_rtcp_explicit) != 1 && $var(rep_audio_rtp_port) > 0) {
		$var(rep_audio_rtcp_port) = $(var(rep_audio_rtp_port){s.int}) + 1;
	}
	if ($var(rep_video_rtcp_explicit) != 1 && $var(rep_video_rtp_port) > 0) {
		$var(rep_video_rtcp_port) = $(var(rep_video_rtp_port){s.int}) + 1;
	}

	$var(req_sdp_ip) = $(var(req_sdp){line.sw,c=IN}{s.select,2, });
	$var(rep_sdp_ip) = $sdp(c:ip);

	xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio RTP: $var(req_audio_rtp_port), RTCP: $var(req_audio_rtcp_port)\n");
	xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio RTP: $var(rep_audio_rtp_port), RTCP: $var(rep_audio_rtcp_port)\n");
	if ($var(req_video_rtp_port) > 0) {
		xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Video RTP: $var(req_video_rtp_port), RTCP: $var(req_video_rtcp_port)\n");
	} else {
		xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio only (no video)\n");
	}
	if ($var(rep_video_rtp_port) > 0) {
		xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Video RTP: $var(rep_video_rtp_port), RTCP: $var(rep_video_rtcp_port)\n");
	} else {
		xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio only (no video)\n");
	}

	$var(audio_media_component_body) = '"0": {
		"medCompN": 1,
		"qosReference": "qosVoNR",
		"medType": "AUDIO",
		"codecs": [
			"downlink\n0\n",
			"uplink\n0\n"
		],
		"medSubComps": {
			"0": {
				"fNum": 1,
				"fDescs": [
					"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
					"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
					"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '",
					"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '"
				],
				"fStatus": "ENABLED",
				"marBwDl": "' + $var(audio_bw_as) + ' Kbps",
				"marBwUl": "' + $var(audio_bw_as) + ' Kbps",
				"flowUsage": "NO_INFO"
			}
		}
	}';
	# Callee → Caller.
	# TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
	if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
		$var(audio_media_component_body) = '"0": {
			"medCompN": 1,
			"qosReference": "qosVoNR",
			"medType": "AUDIO",
			"codecs": [
				"downlink\n0\n",
				"uplink\n0\n"
			],
			"medSubComps": {
				"0": {
					"fNum": 1,
					"fDescs": [
						"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
						"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
						"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '",
						"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '"
					],
					"fStatus": "ENABLED",
					"marBwDl": "' + $var(audio_bw_as) + ' Kbps",
					"marBwUl": "' + $var(audio_bw_as) + ' Kbps",
					"flowUsage": "NO_INFO"
				}
			}
		}';
	}

	$var(video_media_component_body) = "";
	# NOTE: Only if both request and reply SDPs have video media, we consider video for policy authorization and include it in the media components. This is to handle the case where one side doesn't support video and hence doesn't include it in the SDP at all.
	if ($var(req_video_rtp_port) > 0 && $var(rep_video_rtp_port) > 0) {
		$var(video_media_component_body) = '"1": {
			"medCompN": 2,
			"qosReference": "qosVoNR",
			"medType": "VIDEO",
			"codecs": [
				"downlink\n0\n",
				"uplink\n0\n"
			],
			"medSubComps": {
				"0": {
					"fNum": 2,
					"fDescs": [
						"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
						"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
						"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '",
						"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '"
					],
					"fStatus": "ENABLED",
					"marBwDl": "' + $var(video_bw_as) + ' Kbps",
					"marBwUl": "' + $var(video_bw_as) + ' Kbps",
					"flowUsage": "NO_INFO"
				}
			}
		}';
		# Callee → Caller.
		# TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
		if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
			$var(video_media_component_body) = '"1": {
				"medCompN": 2,
				"qosReference": "qosVoNR",
				"medType": "VIDEO",
				"codecs": [
					"downlink\n0\n",
					"uplink\n0\n"
				],
				"medSubComps": {
					"0": {
						"fNum": 2,
						"fDescs": [
							"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
							"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
							"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '",
							"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '"
						],
						"fStatus": "ENABLED",
						"marBwDl": "' + $var(video_bw_as) + ' Kbps",
						"marBwUl": "' + $var(video_bw_as) + ' Kbps",
						"flowUsage": "NO_INFO"
					}
				}
			}';
		}
	}

	$var(media_components_body) = "";
	if ($var(video_media_component_body) != "") {
		$var(media_components_body) = $var(audio_media_component_body) + "," + $var(video_media_component_body);
	} else {
		$var(media_components_body) = $var(audio_media_component_body);
	}

	$var(ue_policy_authorization_body) = '{
		"ascReqData": {
			"afAppId": "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
			"dnn": "ims",
			"medComponents": { ' + $var(media_components_body) + ' },
			"evSubsc": {
				"events": [
					{
						"event": "QOS_NOTIF",
						"notifMethod": "PERIODIC"
					},
					{
						"event": "ANI_REPORT",
						"notifMethod": "ONE_TIME"
					}
				]
			},
			"notifUri": "http://N5_BIND_IP:N5_BIND_PORT",
			"sponStatus": "SPONSOR_DISABLED",
			"gpsi": "msisdn-' + $fU + '",
			"suppFeat": "2",
			"ueIpv4": "' + $var(ue_ip) + '"
		}
	}';
	jansson_append("obj", "", "$var(ue_policy_authorization_body)", "$var(ue_policy_authorization_json_body)");

	xlog("L_DBG", "Constructed UE policy authorization body: $var(ue_policy_authorization_json_body)\n");

	$var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));

	# Real HTTP/2 requirement, confirmed live 2026-09-29 — see the matching,
	# fuller comment in mt.cfg's MT_N5_CALL_PCF_POLICY_AUTH for the full
	# explanation: SCP is genuinely HTTP/2-only (3GPP TS 29.500), confirmed
	# via SCP's own log rejecting a plain HTTP/1.1 request with
	# "nghttp2_session_mem_recv() failed (-903:Received bad client magic
	# byte string)". This is why this project's Kamailio was rebuilt from
	# source to 6.0.8 (see backend/src/application/use-cases/
	# kamailio-source-build.ts) — http_client_request_v2pk() (real HTTP/2 via
	# libcurl's CURLOPT_HTTP_VERSION_2_PRIOR_KNOWLEDGE) doesn't exist before
	# 6.0. $httprhdr(...)/response_headers are also 6.0+-only, which is why
	# AppSession-ID tracking below was deferred until now.
	$var(common_headers) = "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
	$var(common_headers) = $var(common_headers) + "accept: application/json\r\n";
	$var(common_headers) = $var(common_headers) + "accept: application/problem+json\r\n";
	$var(common_headers) = $var(common_headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
	$var(common_headers) = $var(common_headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
	$var(common_headers) = $var(common_headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

	# Reuse the existing AppSession via PATCH (TS 29.514
	# AppSessionContextUpdateData — same "ascReqData"/medComponents JSON
	# shape as creation; PCF's own parser just ignores fields that aren't
	# part of the update schema, confirmed against the real
	# src/pcf/npcf-handler.c handler) when one exists for this call;
	# otherwise POST to create a new one. Content-Type explicitly required
	# either way — confirmed live that http_client_request_v2pk() never
	# auto-populates this, so libcurl would otherwise default to
	# application/x-www-form-urlencoded on a JSON body.
	if ($var(n5_have_id) == 1) {
		$var(n5_method) = "PATCH";
		$var(n5_url) = "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/" + $var(n5_app_session_id);
		$var(headers) = "Content-Type: application/merge-patch+json\r\n" + $var(common_headers);
	} else {
		$var(n5_method) = "POST";
		$var(n5_url) = "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions";
		$var(headers) = "Content-Type: application/json\r\n" + $var(common_headers);
	}

	xlog("L_INFO","MO - Sending N5 QoS Auth ($var(n5_method)) for $fu to PCF (UE IP $var(ue_ip))\n");
	http_client_request_v2pk($var(n5_method), $var(n5_url), "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");

	if ($var(n5_method) == "PATCH" && $rc != 200) {
		# PCF most likely lost its in-memory session state (e.g. a restart —
		# confirmed as a real occurrence in this deployment's own history,
		# see kamailio_6_source_build_progress.md). Don't kill an otherwise-
		# healthy call over a stale ID — drop the mapping and fall back to
		# creating a fresh session, same as every renegotiation used to do
		# before AppSession reuse existed.
		xlog("L_WARN", "N5 PATCH to AppSession $var(n5_app_session_id) failed (HTTP $rc) for Call-Id $ci — clearing stale mapping and retrying as a fresh session create\n");
		sht_rm("mo_call_id_to_call_app_session_and_ue_ip_map", "$ci");
		$var(n5_method) = "POST";
		$var(n5_url) = "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions";
		$var(headers) = "Content-Type: application/json\r\n" + $var(common_headers);
		http_client_request_v2pk($var(n5_method), $var(n5_url), "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");
	}

	switch ($rc) {
		# Success case — PATCH (update) returns 200, POST (create) returns 201.
		case 200:
		case 201:
			xlog("L_INFO", "N5 QoS Session $var(n5_method) successful for UE IP $var(ue_ip). HTTP $rc\n");
			xlog("L_INFO", "HTTP result body: [$var(result)]\n");
			if ($var(n5_method) == "POST") {
				$var(n5_location) = $httprhdr(Location);
				if ($(var(n5_location){s.len}) > 0 && $var(n5_location) != "0") {
					$var(n5_new_id) = $(var(n5_location){re.subst,/^.*\///});
					$sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(n5_new_id) + ";" + $var(ue_ip);
					xlog("L_DBG", "N5 AppSession $var(n5_new_id) stored for Call-Id $ci\n");
				} else {
					xlog("L_WARN", "N5 QoS Session created but no Location header captured for Call-Id $ci — it won't be explicitly terminated at call end, only when the PDU session itself ends\n");
				}
			}
			break;
		# Failure case.
		default:
			xlog("L_ERR", "N5 QoS Session authorization failed for UE with IP $var(ue_ip). Reason code: $rc\n");
			xlog("L_ERR", "cURL error: [$curlerror(error)]\n");
			xlog("L_ERR", "HTTP result body: [$var(result)]\n");
			xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
			# Real bug, confirmed live 2026-10-04: N5 is already a FALLBACK --
			# this whole route only runs because Rx AAR (the primary QoS
			# authorization path) already failed. Hard-killing the call when
			# the fallback ALSO fails means a UE whose SM Policy Association
			# with PCF has a transient gap (confirmed live via real Open5GS
			# PCF source, src/pcf/pcf-sm.c:320 -- a fresh POST for a UE with
			# no currently-live pcf_sess correctly 404s; confirmed via real
			# AMF logs that SMF does legitimate rapid PDU-session modify
			# cycles under heavy call volume, which can transiently tear
			# down and re-establish that association) gets its call dropped
			# entirely instead of just not getting a dedicated QCI=1/5QI=1
			# bearer. A missing dedicated bearer is a quality degradation
			# (best-effort/default bearer instead of guaranteed low-latency
			# voice QoS) -- real carriers fall back this way too rather than
			# dropping the call. Letting the call proceed without N5
			# confirmation is strictly better than a hard failure here.
			# Original upstream behavior (herlesupreeth/docker_open5gs) is
			# preserved as a comment below if a deployment ever needs to go
			# back to hard-failing on this.
			xlog("L_WARN", "N5 QoS authorization failed for call $ci -- proceeding WITHOUT a dedicated bearer rather than dropping the call\n");
			# if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
			# 	dlg_terminate("all", "N5 QoS authorization failed for call");
			# } else {
			# 	send_reply("412", "N5 QoS authorization failed for call");
			# }
	}
}

route[MO_N5_CALL_PCF_POLICY_AUTH_DELETE] {
	# Same real race as MO_N5_CALL_PCF_POLICY_AUTH above (2026-10-04) --
	# require a genuinely non-empty value, not just non-$null, before
	# trusting it as a real AppSession ID to DELETE.
	$var(n5_existing) = $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci);
	if ($(var(n5_existing){s.len}) == 0 || $var(n5_existing) == "0") {
		xlog("L_WARN", "No call AppSession found for Call-Id $ci\n");
		sht_rm("mo_call_id_to_call_app_session_and_ue_ip_map", "$ci");
		return;
	}
	$var(n5_app_session_id) = $(var(n5_existing){s.select,0,;});
	if ($(var(n5_app_session_id){s.len}) == 0 || $var(n5_app_session_id) == "0") {
		xlog("L_WARN", "No call AppSession found for Call-Id $ci\n");
		sht_rm("mo_call_id_to_call_app_session_and_ue_ip_map", "$ci");
		return;
	}
	sht_rm("mo_call_id_to_call_app_session_and_ue_ip_map", "$ci");

	# 3GPP TS 29.514 defines NO http DELETE on /app-sessions/{appSessionId} --
	# only GET and PATCH. Deletion is POST to .../{appSessionId}/delete, and
	# Open5GS PCF implements exactly that (src/pcf/sm-sm.c dispatches on
	# component[2] == "delete" + POST). The old DELETE got 405 "Invalid HTTP
	# method" every single time, which is why pcf_npcf_policyauthorization_
	# handle_delete() -- the only path to N7 PCC-rule removal -- had never once
	# executed, leaking a dedicated 5QI flow per call until the PDU session
	# ended. Body is deliberately left empty: PCF ignores it
	# (lib/sbi/message.c), and that bodyless shape is already proven to parse.
	$var(n5_url) = "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/" + $var(n5_app_session_id) + "/delete";
	$var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
	$var(headers) = "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
	$var(headers) = $var(headers) + "accept: application/json\r\n";
	$var(headers) = $var(headers) + "accept: application/problem+json\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

	xlog("L_INFO", "Terminating N5 AppSession $var(n5_app_session_id) for Call-Id $ci\n");
	http_client_request_v2pk("POST", $var(n5_url), "", "$var(headers)", "$var(result)");
	switch ($rc) {
		case 204:
			# The only success code -- PCF's handler sends 204 unconditionally
			# and first (src/pcf/npcf-handler.c).
			xlog("L_INFO", "N5 AppSession $var(n5_app_session_id) terminated for Call-Id $ci\n");
			break;
		case 404:
			# Benign: PCF already cleaned it up (e.g. the PDU session ended
			# first). Rejected before the method check, in pcf-sm.c.
			xlog("L_INFO", "N5 AppSession $var(n5_app_session_id) already gone for Call-Id $ci (HTTP 404)\n");
			break;
		case 405:
			# Deliberately loud: after the POST/.../delete fix above, a 405 can
			# ONLY mean the method or URL form has regressed. The old single
			# default branch ("may already be gone") silently hid exactly this
			# for as long as the bug existed.
			xlog("L_ERR", "N5 AppSession termination REGRESSED to HTTP 405 for Call-Id $ci — the request must be POST to .../app-sessions/<id>/delete, not DELETE on the resource. Dedicated bearers are leaking again.\n");
			break;
		default:
			# Not fatal either way — the call is already ending (BYE/CANCEL/
			# error) by the time this runs, and a non-204 here most likely
			# just means PCF already cleaned this AppSession up itself (e.g.
			# the PDU session ended first) rather than a real problem.
			xlog("L_WARN", "N5 AppSession $var(n5_app_session_id) termination for Call-Id $ci returned HTTP $rc (may already be gone) — cURL error: [$curlerror(error)]\n");
			break;
	}
}
#!endif
