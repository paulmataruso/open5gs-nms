######################################################################
# Terminating, Initial requests
######################################################################
route[MT] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");
	xnotice("Term UE connection information : IP is $dd and Port is $rp \n");
	xnotice("Term P-CSCF connection information : IP is $RAi and Port is $RAp \n");
	set_dlg_profile("term");

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		# NMS patch, confirmed live 2026-10-01: IPSEC_FORWARD_ADD_SECVERIFY
		# adds Require/Security-Verify sec-agree confirmation headers (RFC
		# 3329) to this initial MT INVITE -- a real device (Google Pixel 7,
		# 2026-09 Android build) was found to require this confirmation on
		# every call-establishing INVITE, not just REGISTER, silently
		# rejecting (480, no ring) an otherwise valid INVITE without it.
		# Deliberately scoped to ONLY this route -- route[MT] is explicitly
		# "Terminating, Initial requests" (see this file's own header
		# comment above) -- matching 3GPP's own scoping of sec-agree
		# confirmation to initial requests. route[MT_indialog] below is
		# left unchanged.
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS | IPSEC_FORWARD_ADD_SECVERIFY);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	t_on_reply("MT_reply");
}

######################################################################
# Replies to Originating Initial Requests
######################################################################
onreply_route[MT_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");
	if (!strempty($(ct{tobody.params}))) {
		append_hf("C-Params: $(ct{tobody.params})\r\n");
	}

#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]") {
		route(NATMANAGE);
		# Real bug, confirmed live 2026-10-05: msg_apply_changes() used to run
		# HERE (right after NATMANAGE's rtpengine_manage() rewrite), which
		# fixed N5's own SDP-port reading (see route[MT_N5_CALL_PCF_POLICY_AUTH]'s
		# own comment for that history) but broke something much bigger: Rx_AAR()
		# below -- specifically ims_qos's w_rx_aar(), for the terminating
		# direction -- ALSO parses this same message's SDP to build the
		# Framed-IP-Address AVP for Rx AA-Request. Once this reply's SDP had
		# already been rewritten to rtpengine's own relay address, every Rx AAR
		# for the MT leg sent that address instead of the real UE's IP --
		# confirmed live via PCRF's own log ("Cannot find Gx Session for
		# IPv4:10.0.1.178", P-CSCF's own address, decoded byte-for-byte from the
		# real Framed-IP-Address AVP) and reproduced on every call tonight
		# regardless of RAT, including genuine 4G-4G pairs -- not an
		# architectural 5G-only limitation like this file used to assume
		# (see MT_aar_reply's own now-partially-stale 2026-09-29 comment below).
		# This one reparse, added by commit 313c6da to fix the N5 bug, is almost
		# certainly why 4G-4G calling broke specifically in the days since that
		# commit. Fix: moved the reparse to the top of
		# route[MT_N5_CALL_PCF_POLICY_AUTH] itself, which runs strictly after
		# Rx_AAR() has already done its own (now correct, pre-rewrite) SDP
		# parse -- N5 still gets the post-rewrite SDP it needs, Rx_AAR no
		# longer does.
	}

	if (t_check_status("180|183|200") && has_body("application/sdp")){
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		# Real bug, confirmed live 2026-10-05: this block had no guard against
		# re-running on every retransmitted 183 -- Kamailio's own 100rel
		# reliability retransmission (RFC 3262) resends this leg's un-PRACKed
		# 183 on an exponential-backoff timer (confirmed live: 5 retransmissions
		# over ~30s), and EACH one re-entered this onreply_route and
		# re-dispatched a fresh Rx_AAR -> N5 fallback round trip -- a growing
		# backlog of slow, overlapping synchronous HTTP/2 PCF calls that can
		# starve the worker pool processing a genuinely-incoming PRACK, which
		# plausibly extends the exact delay that lets the reliability timer
		# exhaust and synthesize an internal failure (destroying the dialog)
		# before the real PRACK/answer is ever processed. Guarded the same way
		# (and sharing the same lock table) as rtp.cfg's offer_registered/
		# answer_registered rtpengine_manage() guard -- Rx AAR authorization for
		# this leg is one logical event, dispatched at most once per dialog,
		# regardless of which reply (183 or 200 OK) first triggers it.
		sht_lock("rtp_manage_lock=>mt_aar_lock");
		$var(do_mt_aar) = 0;
		if ($dlg_var(mt_aar_dispatched) == $null) {
			$dlg_var(mt_aar_dispatched) = "1";
			$var(do_mt_aar) = 1;
		}
		sht_unlock("rtp_manage_lock=>mt_aar_lock");
		if ($var(do_mt_aar) == 1) {
			# The IMS Test Number bot (QCI hardware test / VoLTE validation callee,
			# dedicated Contact port range 15100-15149 — see rtp.cfg's own use of this
			# same check) is a plain SIP UAS with no real PDN/EPS bearer behind it, so
			# it never has a Gx session PCRF can correlate an Rx AA-Request against.
			# Confirmed live (2026-08-30): PCRF logs "Cannot find Gx Session for
			# IPv4:<pcscf/rtpengine relay IP>" / "No Gx Session found" and returns
			# Experimental-Result-Code 5065, which without this guard makes
			# MT_aar_reply's default case fire dlg_terminate("all", "Sorry no QoS
			# available") and kill the whole call — even though the bot had already
			# answered successfully. Skip Rx authorization entirely for this leg; the
			# bot needs no real dedicated bearer of its own.
			if ($ct =~ ":151[0-4][0-9]") {
				xlog("L_DBG", "IMS: MT callee is the IMS Test Number bot — skipping Rx AAR\n");
			} else {
				xlog("L_DBG", "IMS: Received 183 inside term_initial_reply\n");
				xlog("L_DBG","Diameter: Term authorizing media via Rx\n");
				if (Rx_AAR("MT_aar_reply","term","",-1) == 0) {
#!ifdef WITH_N5
					xlog("L_WARN", "IMS: Rx_AAR dispatch failed for MT leg — falling back to N5\n");
					route(MT_N5_CALL_PCF_POLICY_AUTH);
#!endif
					exit;
				}
			}
		} else {
			xlog("L_DBG", "IMS: MT leg Rx AAR already dispatched for this dialog — skipping duplicate (retransmitted reply)\n");
		}
#!else
#!ifdef WITH_N5
		route(MT_N5_CALL_PCF_POLICY_AUTH);
#!endif
#!endif
	}
}

#!ifdef WITH_RX
route[MT_aar_reply]
{
	xlog("L_DBG", "IMS: TERM_SESSION_AAR_REPLY\n");

	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
		case 1:
			xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
			break;
		default:
			xlog("L_ERR", "IMS: AAR failed Orig\n");
			xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
#!ifdef WITH_N5
			# Real bug, confirmed live 2026-09-29: a 5G/NR UE's own PDU session
			# policy lives entirely in PCF (N7/SBI, Npcf_SMPolicyControl), never
			# in PCRF (Gx/Diameter) — confirmed directly from PCRF's own log,
			# "Cannot find Gx Session for IPv4:<UE's real 5G IMS IP>" /
			# "No Gx Session found", on every single Rx AAR for that UE, both as
			# MO and MT, and even at REGISTER-time subscription. Rx can
			# therefore NEVER succeed for a 5G/NR leg, no matter what — it's not
			# a transient failure to retry, it's architectural. Falling back to
			# the already-built N5 (PCF-native policy authorization) route here
			# instead of unconditionally terminating is what lets a call with a
			# 5G leg on either side (4G<->5G or 5G<->5G/VoNR) actually get a
			# real dedicated voice bearer. A 4G leg's Rx AAR still succeeds
			# normally via the case 1 branch above and never reaches here.
			xlog("L_WARN", "IMS: Rx AAR failed for MT leg — falling back to N5 PCF policy authorization\n");
			# Real bug, confirmed live 2026-10-07: this entry into the N5 route
			# is an ASYNC Diameter callback (cdp/ims_qos t_continue), where the
			# message is a restored/faked one whose buffer is not the normal
			# pkg-allocated receive buffer. msg_apply_changes() there corrupts
			# the parser's memory bookkeeping -- see the route's own comment at
			# the reparse. Flag the path so the route can skip it.
			$avp(n5_async_entry) = 1;
			route(MT_N5_CALL_PCF_POLICY_AUTH);
			exit;
#!else
			# Comment this if you want to allow even if Rx fails
			if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
				dlg_terminate("all", "Sorry no QoS available");
				exit;
			}
#!endif
	}
}
#!endif

######################################################################
# In-Dialog-MT-Requests
######################################################################
route[MT_indialog] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after BYE/CANCEL.
	if (is_method("BYE|CANCEL")) {
		xnotice("InDialog Call End/Cancel/Error. Terminating N5 QoS Session\n");
		route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

	t_on_reply("MT_indialog_reply");

	# Append rport only if its a request coming from UE
	if (is_request() && ($hdrc(Via) == 1)) {
		force_rport();
	}

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
}

onreply_route[MT_indialog_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]") {
		# Real bug, confirmed live 2026-09-29 (critic-caught gap in the same-day
		# rtp.cfg offer/answer fix — see that file's own comment for the full
		# mechanism: N5-fallback latency + a real SIP retransmission = rtpengine_
		# manage() called twice for the same offer/answer = rtpengine's relay
		# pairing loops a local port back on itself). That fix only covered
		# initial call setup; this in-dialog path (Hold/Resume/UPDATE/codec
		# renegotiation) has the identical exposure — route(NATMANAGE) ran
		# unconditionally here too, BEFORE the t_is_retr_async_reply() check
		# below, so that check never actually protected NATMANAGE's own
		# rtpengine_manage() call, only the Rx_AAR/N5 continuation logic after
		# it. Deliberately NOT using a $dlg_var "once ever" latch here like the
		# initial-setup fix does — a single dialog can legitimately need
		# multiple real in-dialog offer/answers (Hold, then Resume, then a
		# codec change), so a permanent latch would wrongly suppress every
		# offer/answer after the first legitimate one. t_is_retr_async_reply()
		# is the correct guard instead: it's transaction-scoped, not dialog-
		# scoped, so it naturally allows each new legitimate re-INVITE/UPDATE
		# its own fresh rtpengine registration while still dropping same-
		# transaction retransmissions. Scoped to the same narrower condition
		# the pre-existing check below already used (180/183/200-with-SDP or
		# UPDATE) — messages outside that set can't trigger a duplicate
		# rtpengine offer/answer in the first place, so route(NATMANAGE) below
		# still runs unconditionally for those, unchanged from before.
		if ((t_check_status("180|183|200") && has_body("application/sdp") && !is_method("PRACK")) || is_method("UPDATE")) {
			if (t_is_retr_async_reply()) {
				xlog("L_DBG", "Dropping retransmitted in-dialog reply before NATMANAGE — would double-register with rtpengine\n");
				drop();
			}
		}
		route(NATMANAGE);
		# Real bug, confirmed live 2026-10-05: same Framed-IP-Address mechanism
		# as onreply_route[MT_reply]'s own fix above (see that comment for the
		# full history) -- this reparse used to run HERE, before Rx_AAR() below
		# got a chance to read the pre-rewrite SDP for Framed-IP-Address. Removed
		# for the same reason: route[MT_N5_CALL_PCF_POLICY_AUTH] (both fallback
		# call sites below, sync and async) already reparses at its own top now,
		# so N5 still gets the post-rewrite SDP it needs without exposing
		# Rx_AAR() to it.
	}

	if ((t_check_status("180|183|200") && has_body("application/sdp") && !is_method("PRACK")) || (is_method("UPDATE"))) {
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		# Same IMS Test Number bot exclusion as MT_reply above — the bot has no
		# real Gx session for PCRF to authorize against.
		if ($ct =~ ":151[0-4][0-9]") {
			xlog("L_DBG", "IMS: MT callee is the IMS Test Number bot — skipping in-dialog Rx AAR\n");
		} else {
			# Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
			xlog("L_DBG", "IMS: TERM_SUBSEQUENT reply. This is a 200 OK to a re-INVITE\n");
			xlog("L_DBG","Diameter: Term authorizing media via Rx\n");
			if (Rx_AAR("MT_indialog_aar_reply","term","",-1) == 0) {
#!ifdef WITH_N5
				xlog("L_WARN", "IMS: Rx_AAR dispatch failed for in-dialog MT leg — falling back to N5\n");
				route(MT_N5_CALL_PCF_POLICY_AUTH);
#!endif
				exit;
			}
		}
#!else
#!ifdef WITH_N5
		route(MT_N5_CALL_PCF_POLICY_AUTH);
#!endif
#!endif
	}
}

#!ifdef WITH_RX
route[MT_indialog_aar_reply]
{
	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
		case 1:
			xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
			break;
		default:
			xlog("L_ERR", "IMS: AAR failed Orig\n");
			xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
			xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
#!ifdef WITH_N5
			# Same real bug class as MT_aar_reply (see its own comment) —
			# a 5G/NR UE's in-dialog Rx AAR (Hold/Resume/re-INVITE on an
			# already-connected call) can never succeed either, for the
			# identical reason. Fall back to N5 instead of terminating an
			# otherwise-healthy in-dialog request.
			xlog("L_WARN", "IMS: Rx AAR failed for in-dialog MT leg — falling back to N5 PCF policy authorization\n");
			route(MT_N5_CALL_PCF_POLICY_AUTH);
			exit;
#!else
			# Comment this if you want to allow even if Rx fails
			if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
				dlg_terminate("all", "Sorry no QoS available");
				exit;
			}
#!endif
		}
}
#!endif

#!ifdef WITH_N5
route[MT_N5_CALL_PCF_POLICY_AUTH] {
	# Send N5 PCF policy authorization only on replies.
	if (!is_reply()) {
		return;
	}
	# Authorize N5 policy at most once per (Call-ID, CSeq) -- see the
	# n5_auth_dedup htable's own comment in kamailio_pcscf.cfg for the full
	# root cause. Keyed on CSeq rather than just Call-ID so a genuine mid-call
	# renegotiation (re-INVITE/UPDATE for hold/resume or a codec change) still
	# gets its own PATCH, which is the whole point of the AppSession reuse
	# lifecycle -- only the duplicate leg traversal of ONE reply is suppressed.
	#
	# $sht() is compared directly rather than via $var(): assigning a $null
	# $sht() into a $var() stores integer 0 (pv_core.c:3105-3112), which is the
	# exact defect that broke the AppSession teardown, so it is avoided here
	# rather than reintroduced. ht_slot_lock is per-process re-entrant
	# (ht_api.c:149-176), so locking this table's own key and then reading and
	# writing it inside the lock is deadlock-free.
	$var(n5_do_auth) = 0;
	sht_lock("n5_auth_dedup=>$ci");
		if ($sht(n5_auth_dedup=>$ci) != $cs) {
			$sht(n5_auth_dedup=>$ci) = $cs;
			$var(n5_do_auth) = 1;
		}
	sht_unlock("n5_auth_dedup=>$ci");
	if ($var(n5_do_auth) == 0) {
		xlog("L_INFO", "IMS: N5 policy authorization already issued for Call-Id $ci CSeq $cs — skipping duplicate leg traversal (would PATCH over a correct PCC rule)\n");
		return;
	}
	# This reparse exists so the $sdp(body) reads below see rtpengine's
	# rewritten relay ports rather than the stale pre-rewrite ones. It used to
	# run immediately after NATMANAGE, which broke Rx_AAR's Framed-IP-Address
	# (it reads the same reply's SDP for an unrelated purpose) and took out all
	# 4G-4G calling; commit 75dca52 moved it here, strictly after Rx_AAR's own
	# parse.
	#
	# **Real regression from that move, root-caused live 2026-10-07: it must NOT
	# run when this route is entered from the async Diameter callback.** All 40
	# occurrences of `qm_free(): BUG: bad pointer ... (out of memory block!)` in
	# that boot were inside this route and nowhere else, freeing SIP parser
	# structures (`free_hdr_field_lst`, `free_to`, `free_to_params`). In the
	# async path (MT_aar_reply -> t_continue) the message is a restored/faked
	# one whose buffer is not the normal pkg receive buffer, so rebuilding it
	# in place corrupts the allocator's bookkeeping and aborts this route
	# before it ever issues the N5 request -- PCF received nothing, and every
	# 4G->5G call died with a 500 and never rang. That async path is the ONLY
	# path a 5G leg can take, because Rx is architecturally guaranteed to fail
	# for it (PCRF: "No Gx Session found", Experimental-Result-Code 5065), so
	# this made 5G calling impossible outright while 4G-4G stayed fine.
	#
	# Skipping the reparse on the async path means N5 reports the pre-rewrite
	# media ports there -- the lesser, pre-2026-10-04 behaviour (possible
	# one-way audio on a 5G leg) and vastly better than a call that cannot ring
	# at all. The real fix is to stop needing a reparse here: stash rtpengine's
	# allocated ports into a dlg_var right after rtpengine_manage() in
	# NATMANAGE and read that instead. See TODO.md.
	if ($avp(n5_async_entry) != 1) {
		msg_apply_changes();
	} else {
		xlog("L_INFO", "IMS: N5 entered from async Diameter callback — skipping msg_apply_changes() (would corrupt the parser; see route comment)\n");
	}
	$var(contact_uri) = $(ct{nameaddr.uri});
	$var(ue_ip) = $(var(contact_uri){uri.host});

	# AppSession-ID reuse lookup, reinstated 2026-10-02 now that this host's
	# Kamailio is genuinely 6.0.8 ($httprhdr(...)/response_headers are real,
	# current API there — see the matching comment further down). A Call-Id
	# already present here means a prior SDP exchange on THIS call already
	# created a real N5 AppSession on PCF — reuse it via PATCH instead of
	# POSTing a brand new one on every re-INVITE/UPDATE (Hold/Resume/codec
	# change), and give MT_N5_CALL_PCF_POLICY_AUTH_DELETE below something
	# real to terminate at call end instead of being a permanent no-op (see
	# memory kamailio_6_source_build_progress.md's 2026-10-02 addendum for
	# the real bearer-retention bug this fixes).
	# Real bug, confirmed live 2026-10-03: Kamailio's != $null check does
	# NOT catch an empty-but-non-null string value stored in the htable --
	# a real, observed garbage/empty entry was treated as a real existing
	# AppSession ID, producing a PATCH to a bogus path ("/app-sessions/0"
	# or similar) that PCF correctly rejects as Not Found, breaking the
	# call instead of falling back cleanly to a fresh POST. Now requires
	# BOTH the raw htable value AND the extracted ID to be non-empty
	# ({s.len} > 0) before trusting it.
	# Kamailio's $var() CANNOT hold null -- assigning $null stores integer 0
	# (pv_core.c:3105-3112), so `$var(x) != $null` is permanently TRUE and the
	# value stringifies as "0". That silently inverted every check here:
	# confirmed live, 96 bogus `PATCH /app-sessions/0` and 418 bogus
	# `DELETE /app-sessions/0` against PCF, and the AppSession DELETE never
	# once worked. The 2026-10-04 `{s.len} > 0` mitigation does not help --
	# "0" has length 1 -- and the "cross-worker htable race" it was built on
	# was a misdiagnosis: $sht() correctly returns $null, the 0 is manufactured
	# locally by the assignment.
	#
	# Fixed by dropping the null sentinel entirely: an explicit integer flag
	# plus a `!= "0"` guard. "0" is provably never a valid AppSession id --
	# Open5GS ids come from ogs_pool_index(), which is 1-based, and
	# ogs_pool_find() rejects <= 0 -- so rejecting it is exactly the peer's own
	# validity domain, and it stays correct even if a reference is missed.
	#
