# RTPProxy control
route[NATMANAGE] {
	if (is_request())
		xnotice("REQUEST: $rm $ru ($si:$sp, $ci)\n");
	else
		xnotice("REPLY: $rs $rr ($rm, $si:$sp, $ci)\n");

	if (is_direction("downstream"))
		xnotice("    downstream\n");
	else
		xnotice("    upstream\n");

	xnotice("    Offer: $avp(rtpproxy_offer_flags)\n");
	xnotice("    Answer: $avp(rtpproxy_answer_flags)\n");
	if (isflagset(FLT_MOBILE_ORIG)) {
		xnotice("    mo\n");
	} else {
		xnotice("    mt\n");
	}
	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		#if((is_request() && !check_route_param("rm=")) || (is_reply() && !isflagset(FLT_RTP))) {
		if(!check_route_param("rm=") && !isflagset(FLT_RTP)) {
			xnotice("No RM Param\n");
			return;
		}
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
			($tU != $null && is_in_profile("callee", "$tU"))) {
			# In-Dialog Request from MO side
			if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			}
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
			($tU != $null && is_in_profile("caller", "$tU"))) {
			# In-Dialog Request from MT side
			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			}
		}
	} else {
		if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xlog("L_DBG", "3) ADD_contact_alias();");
			add_contact_alias();
		}
	}

	if (isflagset(FLT_MOBILE_ORIG)) {
		$avp(setid) = 1;
		$avp(extra_id) = "mo";
	} else {
		$avp(setid) = 1;
#		$avp(setid) = 2;
		$avp(extra_id) = "mt";
	}

	if(!t_is_set("onreply_route")) t_on_reply("NAT_REPLY");
	if(!t_is_set("failure_route")) t_on_failure("NATMANAGE");

	if (is_method("BYE") || t_is_failure_route()) {
		rtpengine_manage();
		return;
	}

	setflag(FLT_RTP);

	if (!has_body("application/sdp")) {
		xnotice("No SDP body, skipping RTP handling\n");
		return;
	}

#!ifdef REMOVE_BITALIGNED_AMR
	route(REMOVE_BITALIGNED);
#!endif

#!ifndef FORCE_RTPRELAY
	if (!isflagset(FLT_NAT) || !check_route_param("rm="))
		return;
#!endif

	# Fix for calling between UEs not supporting preconditioning
	if(sdp_get_line_startswith("$avp(mline)", "a=inactive")) {
		xnotice("m-line: $avp(mline)\n");
		sdp_iterator_start("mlineit");
		while(sdp_iterator_next("mlineit")) {
			if($sdpitval(mlineit) =~ "a=inactive") {
				sdp_iterator_rm("mlineit");
				sdp_iterator_append("mlineit", "a=sendrecv\r\n");
				break;
			}
		}
		sdp_iterator_end("mlineit");
		# Do NOT msg_apply_changes() here - confirmed live 2026-07-28 this
		# throws a CRITICAL "null send_sock" error (core/msg_translator.c,
		# lumps_len()/process_lumps() SUBST_SND_IP) because the destination
		# socket for this message isn't resolved yet at this point in the
		# route for a dispatcher-routed call (e.g. the PSTN Gateway's
		# Asterisk trunk, whose own initial offers always start as
		# a=inactive - real UE-to-UE offers essentially never hit this
		# branch at all, which is why it went unnoticed). The error left
		# rtpengine_manage() below still seeing the stale a=inactive body,
		# so it correctly set up a non-forwarding relay - real audio from
		# both phones reached rtpengine but was never forwarded to Asterisk
		# at all (confirmed via packet capture: 0 packets relayed onward).
		# Leaving this lump staged and letting it commit together with the
		# msg_apply_changes() calls below (which run after this same
		# request's destination is resolved) fixes this without needing to
		# special-case PSTN/dispatcher-routed calls here.
	}

	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
			($tU != $null && is_in_profile("callee", "$tU"))) {
			# In-Dialog Request from MO side
			if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			}
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
			($tU != $null && is_in_profile("caller", "$tU"))) {
			# In-Dialog Request from MT side
			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			}
		}
	} else {
		# Initial Requests
		if ($avp(rtpproxy_offer_flags) == $null)
			return;
		if ($avp(rtpproxy_answer_flags) == $null)
			return;

		if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
			xnotice("Handling RTP for initial request from $fU on mo side\n");
			set_dlg_profile("caller", "$fU");
			# Real-UE-to-real-UE precondition deadlock workaround: two real
			# phones calling each other never confirm RFC3312 preconditions
			# (neither side ever sends the confirming UPDATE — each seems to
			# wait on the other), so the call sticks at "183 Session
			# Progress" forever and the caller eventually cancels. Confirmed
			# live: signaling routes correctly, rtpengine allocates relay
			# ports, but literally zero RTP packets ever traverse them from
			# either phone. The IMS Test Number bot's own SIP UAS correctly
			# implements the full precondition dance (as both offerer and
			# answerer, hard-won via a 3-bug fix arc — see memory:
			# ims-echo-test-bot) and must be left untouched, so this only
			# strips preconditions when BOTH legs are real UEs, detected via
			# the bot's dedicated Contact port range (15100-15149,
			# BASE_SIP_PORT/MAX_INSTANCES in ims-test-number-controller.ts).
			if (!($ct =~ ":151[0-4][0-9]")) {
				sdp_remove_line_by_prefix("a=des:qos");
				sdp_remove_line_by_prefix("a=curr:qos");
				# Real fix, confirmed live 2026-10-04: the "commits together
				# with a later stage" theory below was wrong -- rtpengine_
				# manage()/sdp_get() read a parse-once-cached msg->body that
				# a staged-but-unapplied lump never invalidates, so this
				# edit never actually reached a real call. Confirmed live: a
				# real iPhone (subscriber 1010) calling a 2G destination
				# through PSTN Gateway's Asterisk sent ~0 uplink RTP --
				# correctly withholding media while waiting for a
				# precondition confirmation that never arrives, exactly the
				# deadlock this block exists to prevent. msg_apply_changes()
				# here IS safe despite the CRITICAL this used to log
				# (confirmed against real source, core/msg_translator.c): a
				# pending P-Charging-Vector SUBST_SND_IP lump (staged
				# unconditionally by mo.cfg's own sip_p_charging_vector()
				# call, unrelated to this edit) hitting a null send_sock
				# only omits that one header's trailing value -- confirmed
				# never read back anywhere in this codebase, pure
				# offline-CDR metadata, no crash, no effect on this or any
				# other lump. Must run BEFORE rtpengine_manage() below --
				# that ordering is what actually invalidates the stale
				# cached SDP parse. See memory
				# pcscf_precondition_sdp_rewrite_bug_2026-10-03.md for the
				# full arc (covers a SEPARATE, still-abandoned
				# a=inactive->sendrecv block elsewhere in this file -- don't
				# confuse the two).
				msg_apply_changes();
				$dlg_var(real_ue_caller) = "1";

				# EXPERIMENT, added 2026-07-29 - testing whether Android's
				# strict Shannon-modem SDP validator is rejecting the mere
				# PRESENCE of ICE candidate lines (a=candidate/ice-ufrag/
				# ice-pwd), independent of whether it plans to use ICE at
				# all. Real 3GPP VoLTE conventionally never uses ICE; this
				# project's rtpengine offer flags force it unconditionally,
				# inherited byte-for-byte from the docker_open5gs reference
				# implementation - confirmed NOT device-specific in the
				# sense that the code path is identical for iPhone and
				# Android, but never actually tested for whether Android
				# TOLERATES it the way iPhone does. Scoped to real UE
				# callers only (same guard as the qos-line stripping above)
				# so the IMS Test Number bot is untouched.
				#
				# TO ROLL BACK: delete this comment block and the one
				# assignment line immediately below it. Nothing else in this
				# file depends on it.
				$avp(rtpproxy_offer_flags) = $(avp(rtpproxy_offer_flags){re.subst,/ICE=force/ICE=remove/});
			}
			# Real bug, confirmed live 2026-09-29: this branch previously called
			# rtpengine_manage() unconditionally on every pass through NATMANAGE for an
			# "initial request" — but route(NATMANAGE) itself runs on every retransmission
			# too (the only retransmission guard in this file, t_is_retr_async_reply(), sits
			# further down in mo.cfg/mt.cfg and only protects the Rx_AAR/N5 continuation
			# logic, not this offer/answer call). Confirmed live: real 183 retransmissions
			# arriving during the N5-fallback path's own extra latency (a full synchronous
			# HTTP/2 POST to PCF via SCP, meaningfully slower than a local Rx AAR to PCRF)
			# land inside that longer window and re-enter this branch, calling
			# rtpengine_manage() a second time for the same offer — with $avp(rtpproxy_
			# offer_flags) potentially already mutated by the ICE=force->remove rewrite
			# above, so the second call can disagree with the first on ICE handling. Two
			# such calls is exactly how rtpengine's own relay pairing ends up looping a
			# local port pair back on itself — real packet capture showed 10.0.1.178
			# sending to itself at ~20,000 pps, aborting with "Too many packets in UDP
			# receive queue" a few seconds into the call. This is the SAME bug class
			# already found and fixed for the Asterisk B2BUA path below (offer_registered/
			# answer_registered, added 2026-08-30) — just never guarded on this, the
			# primary UE-to-UE branch, since the race window was too narrow to hit on a
			# plain 4G-4G (Rx-success) call in practice.
			# Real bug, confirmed live 2026-10-05: the dlg_var check-then-set
			# above was not atomic across worker processes -- two workers
			# could both read offer_registered as unset before either wrote
			# "1", both call rtpengine_manage(), and each get an independent
			# relay port for the same offer (confirmed via packet capture: a
			# stale, orphaned rtpengine hairpin left running alongside the
			# real one). Serializing just the check-and-set with sht_lock
			# (not the rtpengine_manage() call itself, to avoid serializing
			# unrelated concurrent calls against each other) closes the race.
			sht_lock("rtp_manage_lock=>offer_lock");
			$var(do_offer_manage) = 0;
			if ($dlg_var(offer_registered) == $null) {
				$dlg_var(offer_registered) = "1";
				$var(do_offer_manage) = 1;
			}
			sht_unlock("rtp_manage_lock=>offer_lock");
			if ($var(do_offer_manage) == 1) {
				rtpengine_manage($avp(rtpproxy_offer_flags));
			} else {
				xnotice("Offer already registered with rtpengine for this dialog — skipping duplicate rtpengine_manage() (retransmitted/duplicate request)\n");
			}
		} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xnotice("Handling RTP for initial reply from $tU on mt side\n");
			set_dlg_profile("callee", "$tU");
			if ($dlg_var(real_ue_caller) == "1" && !($ct =~ ":151[0-4][0-9]")) {
				sdp_remove_line_by_prefix("a=des:qos");
				sdp_remove_line_by_prefix("a=curr:qos");
				# Real-UE-to-real-UE follow-up fix: with preconditions gone,
				# the callee's own 183 still demands "Require: 100rel,timer"
				# (RFC4028 session timers) — but the real iPhone caller's own
				# PRACK never declares timer support at all (only
				# "Supported: 100rel,path,replaces"), a genuine interop
				# mismatch. Strip "timer" from the Require header the same
				# way as the qos lines so the callee never asks for
				# something this caller can't/won't honor.
				subst_hf("Require", "/,\s*timer//", "g");
				subst_hf("Require", "/timer\s*,\s*//", "g");
				# Real fix, confirmed live 2026-10-04: this is actually
				# SAFER than the offer-side block above -- confirmed
				# against real source that sip_msg_apply_changes() on a
				# reply calls generate_res_buf_from_sip_res(), which takes
				# no dest_info_t/send_sock parameter at all, so the
				# null-send_sock failure mode this used to worry about is
				# structurally impossible here, not just unlikely. The
				# "same null send_sock issue" claim this comment used to
				# make never actually applied to this reply-side block.
				# Committing here is what makes BOTH the qos-line removal
				# above AND this Require-header rewrite actually reach the
				# wire (see the offer-side block's own comment for the full
				# mechanism; memory
				# pcscf_precondition_sdp_rewrite_bug_2026-10-03.md has the
				# complete arc). Re-running on every retransmit of the 200
				# OK is a normal, idempotent re-commit, not a new risk.
				# Must run BEFORE rtpengine_manage() below.
				msg_apply_changes();

				# EXPERIMENT, added 2026-07-29, paired with the mo-side
				# offer-flags swap above. Confirmed live same day: leaving
				# this side at its original "ICE=force" while the offer side
				# was changed to "ICE=remove" is an asymmetric flag mismatch
				# - broke audio for the Android-as-caller direction (call
				# rang and connected, zero RTP either way) while the offer
				# fix was independently confirmed working for Android-as-
				# callee. Mirroring the same swap here keeps both directions
				# using a consistent (no-ICE) flag pair for real UE-to-UE
				# calls. TO ROLL BACK: delete this comment and the one
				# assignment line immediately below it.
				$avp(rtpproxy_answer_flags) = $(avp(rtpproxy_answer_flags){re.subst,/ICE=force/ICE=remove/});
			}
			# Real bug, confirmed live 2026-09-29 — same class as the offer-side fix
			# above (see its comment for the full mechanism): route(NATMANAGE) re-runs
			# on every retransmitted provisional/final reply, and this branch previously
			# called rtpengine_manage() unconditionally on each pass. A real 183
			# retransmission landing during the N5-fallback path's extra latency
			# (synchronous HTTP/2 POST to PCF, slower than a local Rx AAR to PCRF)
			# re-enters this branch and calls rtpengine_manage() a second time for the
			# same answer, with $avp(rtpproxy_answer_flags) potentially already mutated
			# by the ICE=force->remove rewrite above — confirmed live via packet capture:
			# rtpengine's own relay pairing loops a local port pair back on itself
			# (10.0.1.178 sending to itself at ~20,000 pps), aborting a few seconds into
			# the call with "Too many packets in UDP receive queue". Guarded the same way
			# offer_registered already is, and the same way answer_registered already
			# guards the Asterisk B2BUA branch below (added 2026-08-30) — just never
			# applied to this, the primary UE-to-UE branch.
			# Real bug, confirmed live 2026-10-05: same race as offer_registered
			# above (see that comment for the full mechanism) -- confirmed live
			# on a real 0004->0006 call, two worker PIDs 82ms apart both took
			# the "unset" branch for this SAME dialog's answer, each independently
			# calling rtpengine_manage() and getting a different relay port. The
			# later one's port is what reached the SDP/N5 authorization; the
			# earlier one's port was left as a dead, orphaned rtpengine hairpin
			# (confirmed via packet capture: 500+ packets into it, zero ever
			# returned). Serializing just the check-and-set with sht_lock closes
			# the race without holding the lock across rtpengine_manage() itself.
			sht_lock("rtp_manage_lock=>answer_lock");
			$var(do_answer_manage) = 0;
			if ($dlg_var(answer_registered) == $null) {
				$dlg_var(answer_registered) = "1";
				$var(do_answer_manage) = 1;
			}
			sht_unlock("rtp_manage_lock=>answer_lock");
			if ($var(do_answer_manage) == 1) {
				rtpengine_manage($avp(rtpproxy_answer_flags));
			} else {
				xnotice("Answer already registered with rtpengine for this dialog — skipping duplicate rtpengine_manage() (retransmitted/duplicate reply)\n");
			}
		} else if (is_reply() && isflagset(FLT_MOBILE_ORIG) && !($ct =~ ".*g.3gpp.*") && $dlg_var(ast_mo_answer_done) == $null && $dlg_var(answer_registered) == $null) {
			# Restored 2026-07-28 - genuinely required for Asterisk/PSTN
			# Gateway calls specifically, not optional. Root cause understood
			# now: a direct real-UE-to-real-UE call is ONE shared SIP dialog
			# (same Call-ID) all the way through P-CSCF, so rtpengine
			# correlates the mo-side offer (above) and the mt-side answer
			# (the other branch in this same route, for the OTHER real UE's
			# leg) into a single complete relay automatically. Asterisk is a
			# real B2BUA - it splits every PSTN Gateway call into TWO
			# separate dialogs with different Call-IDs (caller<->Asterisk,
			# Asterisk<->callee). Each one needs its OWN complete offer+
			# answer pair processed by rtpengine to build a working relay.
			# Without this branch, the caller's own dialog only ever gave
			# rtpengine the offer half - never the matching answer - so
			# rtpengine had a relay allocated but no idea where to forward
			# the caller's audio. Confirmed via packet capture 2026-07-28:
			# real audio from both phones reached rtpengine but was never
			# forwarded to Asterisk at all (0 packets in that direction).
			#
			# This branch was tried once before (also 2026-07-28) and
			# reverted after appearing to create a second, disconnected
			# relay pair. Re-added because leaving it out was confirmed via
			# the same tooling to leave BOTH of Asterisk's two dialogs
			# permanently half-open - i.e. strictly worse. If a duplicate-
			# relay symptom reappears, the fix is to find why this call
			# doesn't correlate to the existing rtpengine session (Call-ID/
			# from-tag/to-tag matching), not to remove this branch again.
			#
			# Real bug found live (2026-08-15): the 2026-07-29 guard here used
			# to be ($sdp(c:ip) != IPSEC_LISTEN_ADDR), meant to skip a reply
			# whose SDP rtpengine has *already* rewritten (which would show
			# c=IN IP4 pointing at rtpengine's own address, IPSEC_LISTEN_ADDR).
			# That's a real, sound check for a genuine real-UE-to-real-UE
			# relay reply — but Asterisk's own raw, NEVER-rtpengine-processed
			# SDP *also* always shows c=IN IP4 IPSEC_LISTEN_ADDR, because
			# pjsip_pstn.conf's external_media_address is deliberately set to
			# this exact same P-CSCF IP (needed so Asterisk's advertised media
			# address is at least real/routable instead of an unreachable
			# loopback — see that file's own comment). The two settings
			# sharing one IP for unrelated reasons meant this guard was always
			# false for every single Asterisk reply, silently no-op'ing this
			# entire branch on every PSTN Gateway call — confirmed live via
			# Asterisk's own "pjsip show channelstats" during a real test call
			# showing Receive permanently stuck at 0 while packets provably
			# arrived at the right socket on the wire the whole time: rtpengine
			# never learned where to forward them because this branch never
			# ran. Replaced the IP comparison with a per-dialog $dlg_var flag,
			# which correctly answers "have I actually run rtpengine_manage()
			# for THIS reply already" instead of "does this SDP's address
			# happen to coincide with rtpengine's own" — reverify PSTN Gateway
			# audio after this lands, don't assume it's fixed without testing.
			xnotice("Handling RTP for initial reply from $tU on mo side (Asterisk B2BUA answer)\n");
			rtpengine_manage($avp(rtpproxy_answer_flags));
			$dlg_var(ast_mo_answer_done) = "1";
		} else if (is_request() && !isflagset(FLT_MOBILE_ORIG) && !($ct =~ ".*g.3gpp.*") && $dlg_var(offer_registered) == $null) {
			# Real bug found live 2026-08-30, confirming the "not a confirmed fix"
			# warning at the end of the comment block below: the !($ct =~ ".*g.3gpp.*")
			# guard alone does NOT correctly exclude direct UE-to-UE calls. linphonec
			# (used by this project's own automated VoLTE/QCI validation tests, and
			# almost certainly by Android's IMS stack too - see the "Android
			# investigation" reference below) never sends a +g.3gpp.* Contact param
			# either, same as Asterisk, so a call between two ordinary local UEs also
			# satisfies this guard. Confirmed via rtpengine's own journal logging
			# "More than 30 duplicate packets detected... to avoid potential loop" and
			# "Too many packets in UDP receive queue" for a validation-test call that
			# never touched Asterisk at all - this branch really was firing a second
			# time on the SAME offer the mo-side branch above had already registered,
			# exactly the failure mode the comment below already predicted. Added the
			# $dlg_var(offer_registered) check (set at the end of the mo-side offer
			# branch above) as the real discriminator instead: a genuine Asterisk MT
			# dialog is a SEPARATE Call-ID that never goes through this P-CSCF's own
			# mo-side flow, so it never gets this flag set, while a direct UE-to-UE
			# call's forwarded INVITE (processed a second time here, now from the
			# callee's terminating perspective) always does. PSTN Gateway audio still
			# needs re-verification after this lands - same standing caveat as every
			# other change to this branch's history below.
			# Restored 2026-07-28, minimal form. An offer-side branch here was
			# tried four times and abandoned live 2026-07-27 - EVERY attempt
			# included manual SDP body edits (qos-line stripping and/or
			# msg_apply_changes()) and confirmed via packet capture that
			# ipsec_forward() delivers the real UE a byte-identical,
			# un-rewritten copy of Asterisk's raw offer regardless of where
			# msg_apply_changes() is called - i.e. any body rewrite attempted
			# here is silently discarded before reaching the wire. That's
			# still true and this branch does NOT try to rewrite the body
			# for that reason - no sdp_remove_line_by_prefix(), no
			# msg_apply_changes(). The point of this call is different: it
			# lets rtpengine itself learn/track this Call-ID's session
			# pairing (Asterisk's own address, parsed from this offer's SDP)
			# even though the rewritten copy never reaches the real UE -
			# same reasoning as the mo-reply branch above. Without this,
			# rtpengine only ever saw the mt-side answer (the branch above)
			# for this dialog and never the matching offer, which left it
			# unable to relay the callee's own audio back toward Asterisk -
			# confirmed via packet capture 2026-07-28: caller's voice
			# reached the callee fine (mo-reply fix above), but the
			# callee's own voice never reached Asterisk (0 packets that
			# direction). The real UE still gets Asterisk's raw offer via
			# ipsec_forward() either way - this call doesn't change what's
			# delivered to the wire, only what rtpengine itself knows.
			#
			# Added 2026-07-29: the !($ct =~ ".*g.3gpp.*") guard, matching the
			# same check the neighboring "mo side (Asterisk B2BUA answer)"
			# branch already used. docker_open5gs's reference implementation
			# has no equivalent of this branch at all - it's this project's
			# own addition and had no condition restricting it to
			# Asterisk-originated calls, so it fired on every single MT-side
			# initial request, INCLUDING real direct UE-to-UE calls (e.g.
			# every iPhone->Android attempt in the Android investigation),
			# calling rtpengine_manage() a second time on an offer the mo-side
			# branch (above) had already registered for that same Call-ID.
			# Scoping this to non-3GPP Contacts (i.e. Asterisk, which unlike
			# a real UE never sends +g.3gpp.* Contact params) restores the
			# original intent: this call exists purely so rtpengine learns
			# Asterisk's B2BUA session pairing, and should not run at all for
			# calls that never involve Asterisk. Reverify PSTN Gateway audio
			# AND re-test the Android investigation's direct-IMS repro after
			# this lands - this was a real, live hypothesis for both, not a
			# confirmed fix for either.
			xnotice("Handling RTP for initial request from $tU on mt side (Asterisk B2BUA offer)\n");
			rtpengine_manage($avp(rtpproxy_offer_flags));
		}
	}
}

# manage incoming replies
onreply_route[NAT_REPLY] {
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);
}

route[REMOVE_BITALIGNED] {
	if (sdp_get_line_startswith("$avp(mline)", "m=")) {
		# xlog("m-line: $avp(mline)\n");
		sdp_get("$avp(sdp)");
		# xlog("\n$avp(sdp)\n");
		$var(x) = -1;
		$var(remove) = "";
		$var(codec) = $(avp(mline){s.select,$var(x), });
		# xlog("$$var(codec) => $var(codec)\n");
		while ($(var(codec){s.int}) > 0) {
			# xlog("$var(x)) $$var(codec) => $var(codec)\n");
			$var(s) = "a=fmtp:"+$var(codec);
			# xlog("$$var(s) => $var(s)\n");
			$var(fmtp) = $(avp(sdp){line.sw,$var(s)});
			# xlog("$$var(fmtp) => $var(fmtp)\n");
			if ($var(fmtp) =~ "a=fmtp:"+$var(codec)+" mode-change-capability.*") {
				# xlog("Match: $var(codec)\n");
				if ($var(remove) == "") {
					$var(remove) = $var(codec);
				} else {
					$var(remove) = $var(remove)+","+$var(codec);
				}
			}
			$var(codec) = $(avp(mline){s.select,$var(x), });
			$var(x) = $var(x) - 1;
		}
		# xlog("$$var(remove) => $var(remove)\n");
		if ($var(remove) != "") {
			sdp_remove_codecs_by_id($var(remove), "audio");
			msg_apply_changes();
		}
	}
}

