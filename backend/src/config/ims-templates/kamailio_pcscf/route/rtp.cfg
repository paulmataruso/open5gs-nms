# RTPProxy control
route[NATMANAGE] {
	if (is_request())
		xnotice("REQUEST: $rm $ru ($si:$sp, $ci)\n");
	else
		xnotice("REPLY: $rs $rr ($rm, $si:$sp, $ci)\n");

	if (is_direction("downstream"))
		xnotice("    downstream\n");
	else
		xnotice("    upstream\n");

	xnotice("    Offer: $avp(rtpproxy_offer_flags)\n");
	xnotice("    Answer: $avp(rtpproxy_answer_flags)\n");
	if (isflagset(FLT_MOBILE_ORIG)) {
		xnotice("    mo\n");
	} else {
		xnotice("    mt\n");
	}
	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		#if((is_request() && !check_route_param("rm=")) || (is_reply() && !isflagset(FLT_RTP))) {
		if(!check_route_param("rm=") && !isflagset(FLT_RTP)) {
			xnotice("No RM Param\n");
			return;
		}
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
			($tU != $null && is_in_profile("callee", "$tU"))) {
			# In-Dialog Request from MO side
			if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			}
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
			($tU != $null && is_in_profile("caller", "$tU"))) {
			# In-Dialog Request from MT side
			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			}
		}
	} else {
		if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xlog("L_DBG", "3) ADD_contact_alias();");
			add_contact_alias();
		}
	}

	if (isflagset(FLT_MOBILE_ORIG)) {
		$avp(setid) = 1;
		$avp(extra_id) = "mo";
	} else {
		$avp(setid) = 1;
#		$avp(setid) = 2;
		$avp(extra_id) = "mt";
	}

	if(!t_is_set("onreply_route")) t_on_reply("NAT_REPLY");
	if(!t_is_set("failure_route")) t_on_failure("NATMANAGE");

	if (is_method("BYE") || t_is_failure_route()) {
		rtpengine_manage();
		return;
	}

	setflag(FLT_RTP);

	if (!has_body("application/sdp")) {
		xnotice("No SDP body, skipping RTP handling\n");
		return;
	}

#!ifdef REMOVE_BITALIGNED_AMR
	route(REMOVE_BITALIGNED);
#!endif

#!ifndef FORCE_RTPRELAY
	if (!isflagset(FLT_NAT) || !check_route_param("rm="))
		return;
#!endif

	# Fix for calling between UEs not supporting preconditioning
	if(sdp_get_line_startswith("$avp(mline)", "a=inactive")) {
		xnotice("m-line: $avp(mline)\n");
		sdp_iterator_start("mlineit");
		while(sdp_iterator_next("mlineit")) {
			if($sdpitval(mlineit) =~ "a=inactive") {
				sdp_iterator_rm("mlineit");
				sdp_iterator_append("mlineit", "a=sendrecv\r\n");
				break;
			}
		}
		sdp_iterator_end("mlineit");
		# Do NOT msg_apply_changes() here - confirmed live 2026-07-28 this
		# throws a CRITICAL "null send_sock" error (core/msg_translator.c,
		# lumps_len()/process_lumps() SUBST_SND_IP) because the destination
		# socket for this message isn't resolved yet at this point in the
		# route for a dispatcher-routed call (e.g. the PSTN Gateway's
		# Asterisk trunk, whose own initial offers always start as
		# a=inactive - real UE-to-UE offers essentially never hit this
		# branch at all, which is why it went unnoticed). The error left
		# rtpengine_manage() below still seeing the stale a=inactive body,
		# so it correctly set up a non-forwarding relay - real audio from
		# both phones reached rtpengine but was never forwarded to Asterisk
		# at all (confirmed via packet capture: 0 packets relayed onward).
		# Leaving this lump staged and letting it commit together with the
		# msg_apply_changes() calls below (which run after this same
		# request's destination is resolved) fixes this without needing to
		# special-case PSTN/dispatcher-routed calls here.
	}

	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
			($tU != $null && is_in_profile("callee", "$tU"))) {
			# In-Dialog Request from MO side
			if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			}
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
			($tU != $null && is_in_profile("caller", "$tU"))) {
			# In-Dialog Request from MT side
			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
				rtpengine_manage();
			}
		}
	} else {
		# Initial Requests
		if ($avp(rtpproxy_offer_flags) == $null)
			return;
		if ($avp(rtpproxy_answer_flags) == $null)
			return;

		if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
			xnotice("Handling RTP for initial request from $fU on mo side\n");
			set_dlg_profile("caller", "$fU");
			# Real-UE-to-real-UE precondition deadlock workaround: two real
			# phones calling each other never confirm RFC3312 preconditions
			# (neither side ever sends the confirming UPDATE — each seems to
			# wait on the other), so the call sticks at "183 Session
			# Progress" forever and the caller eventually cancels. Confirmed
			# live: signaling routes correctly, rtpengine allocates relay
			# ports, but literally zero RTP packets ever traverse them from
			# either phone. The IMS Test Number bot's own SIP UAS correctly
			# implements the full precondition dance (as both offerer and
			# answerer, hard-won via a 3-bug fix arc — see memory:
			# ims-echo-test-bot) and must be left untouched, so this only
			# strips preconditions when BOTH legs are real UEs, detected via
			# the bot's dedicated Contact port range (15100-15149,
			# BASE_SIP_PORT/MAX_INSTANCES in ims-test-number-controller.ts).
			if (!($ct =~ ":151[0-4][0-9]")) {
				sdp_remove_line_by_prefix("a=des:qos");
				sdp_remove_line_by_prefix("a=curr:qos");
				msg_apply_changes();
				$dlg_var(real_ue_caller) = "1";
			}
			rtpengine_manage($avp(rtpproxy_offer_flags));
		} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xnotice("Handling RTP for initial reply from $tU on mt side\n");
			set_dlg_profile("callee", "$tU");
			if ($dlg_var(real_ue_caller) == "1" && !($ct =~ ":151[0-4][0-9]")) {
				sdp_remove_line_by_prefix("a=des:qos");
				sdp_remove_line_by_prefix("a=curr:qos");
				# Real-UE-to-real-UE follow-up fix: with preconditions gone,
				# the callee's own 183 still demands "Require: 100rel,timer"
				# (RFC4028 session timers) — but the real iPhone caller's own
				# PRACK never declares timer support at all (only
				# "Supported: 100rel,path,replaces"), a genuine interop
				# mismatch. Strip "timer" from the Require header the same
				# way as the qos lines so the callee never asks for
				# something this caller can't/won't honor.
				subst_hf("Require", "/,\s*timer//", "g");
				subst_hf("Require", "/timer\s*,\s*//", "g");
				msg_apply_changes();
			}
			rtpengine_manage($avp(rtpproxy_answer_flags));
		} else if (is_reply() && isflagset(FLT_MOBILE_ORIG) && !($ct =~ ".*g.3gpp.*")) {
			# Restored 2026-07-28 - genuinely required for Asterisk/PSTN
			# Gateway calls specifically, not optional. Root cause understood
			# now: a direct real-UE-to-real-UE call is ONE shared SIP dialog
			# (same Call-ID) all the way through P-CSCF, so rtpengine
			# correlates the mo-side offer (above) and the mt-side answer
			# (the other branch in this same route, for the OTHER real UE's
			# leg) into a single complete relay automatically. Asterisk is a
			# real B2BUA - it splits every PSTN Gateway call into TWO
			# separate dialogs with different Call-IDs (caller<->Asterisk,
			# Asterisk<->callee). Each one needs its OWN complete offer+
			# answer pair processed by rtpengine to build a working relay.
			# Without this branch, the caller's own dialog only ever gave
			# rtpengine the offer half - never the matching answer - so
			# rtpengine had a relay allocated but no idea where to forward
			# the caller's audio. Confirmed via packet capture 2026-07-28:
			# real audio from both phones reached rtpengine but was never
			# forwarded to Asterisk at all (0 packets in that direction).
			#
			# This branch was tried once before (also 2026-07-28) and
			# reverted after appearing to create a second, disconnected
			# relay pair. Re-added because leaving it out was confirmed via
			# the same tooling to leave BOTH of Asterisk's two dialogs
			# permanently half-open - i.e. strictly worse. If a duplicate-
			# relay symptom reappears, the fix is to find why this call
			# doesn't correlate to the existing rtpengine session (Call-ID/
			# from-tag/to-tag matching), not to remove this branch again.
			xnotice("Handling RTP for initial reply from $tU on mo side (Asterisk B2BUA answer)\n");
			rtpengine_manage($avp(rtpproxy_answer_flags));
		} else if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
			# Restored 2026-07-28, minimal form. An offer-side branch here was
			# tried four times and abandoned live 2026-07-27 - EVERY attempt
			# included manual SDP body edits (qos-line stripping and/or
			# msg_apply_changes()) and confirmed via packet capture that
			# ipsec_forward() delivers the real UE a byte-identical,
			# un-rewritten copy of Asterisk's raw offer regardless of where
			# msg_apply_changes() is called - i.e. any body rewrite attempted
			# here is silently discarded before reaching the wire. That's
			# still true and this branch does NOT try to rewrite the body
			# for that reason - no sdp_remove_line_by_prefix(), no
			# msg_apply_changes(). The point of this call is different: it
			# lets rtpengine itself learn/track this Call-ID's session
			# pairing (Asterisk's own address, parsed from this offer's SDP)
			# even though the rewritten copy never reaches the real UE -
			# same reasoning as the mo-reply branch above. Without this,
			# rtpengine only ever saw the mt-side answer (the branch above)
			# for this dialog and never the matching offer, which left it
			# unable to relay the callee's own audio back toward Asterisk -
			# confirmed via packet capture 2026-07-28: caller's voice
			# reached the callee fine (mo-reply fix above), but the
			# callee's own voice never reached Asterisk (0 packets that
			# direction). The real UE still gets Asterisk's raw offer via
			# ipsec_forward() either way - this call doesn't change what's
			# delivered to the wire, only what rtpengine itself knows.
			xnotice("Handling RTP for initial request from $tU on mt side (Asterisk B2BUA offer)\n");
			rtpengine_manage($avp(rtpproxy_offer_flags));
		}
	}
}

# manage incoming replies
onreply_route[NAT_REPLY] {
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);
}

route[REMOVE_BITALIGNED] {
	if (sdp_get_line_startswith("$avp(mline)", "m=")) {
		# xlog("m-line: $avp(mline)\n");
		sdp_get("$avp(sdp)");
		# xlog("\n$avp(sdp)\n");
		$var(x) = -1;
		$var(remove) = "";
		$var(codec) = $(avp(mline){s.select,$var(x), });
		# xlog("$$var(codec) => $var(codec)\n");
		while ($(var(codec){s.int}) > 0) {
			# xlog("$var(x)) $$var(codec) => $var(codec)\n");
			$var(s) = "a=fmtp:"+$var(codec);
			# xlog("$$var(s) => $var(s)\n");
			$var(fmtp) = $(avp(sdp){line.sw,$var(s)});
			# xlog("$$var(fmtp) => $var(fmtp)\n");
			if ($var(fmtp) =~ "a=fmtp:"+$var(codec)+" mode-change-capability.*") {
				# xlog("Match: $var(codec)\n");
				if ($var(remove) == "") {
					$var(remove) = $var(codec);
				} else {
					$var(remove) = $var(remove)+","+$var(codec);
				}
			}
			$var(codec) = $(avp(mline){s.select,$var(x), });
			$var(x) = $var(x) - 1;
		}
		# xlog("$$var(remove) => $var(remove)\n");
		if ($var(remove) != "") {
			sdp_remove_codecs_by_id($var(remove), "audio");
			msg_apply_changes();
		}
	}
}

