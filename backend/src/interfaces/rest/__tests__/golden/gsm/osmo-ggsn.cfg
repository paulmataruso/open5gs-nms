log stderr
 logging filter all 1
 logging print category 1
line vty
 no login
ggsn ggsn0
 gtp state-dir /tmp
 gtp bind-ip 127.0.0.5
 apn internet
  gtpu-mode tun
  type-support v4
  tun-device apn-gprs
  ip prefix dynamic 10.45.0.128/25
  ip dns 0 10.0.1.180
  ip dns 1 9.9.9.9
  no shutdown
 default-apn internet
 no shutdown ggsn
