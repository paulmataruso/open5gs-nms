services:
  nginx:
    image: nginx:alpine
    container_name: open5gs-nms-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nms.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,container"
    labels:
      com.open5gs.nms.service: "nginx"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # NOTE: build-time host networking is deliberately NOT set here.
      #
      # It used to be (`network: host` under build:), to give the build the
      # host's own resolver. That matters on a deployed host, because this
      # project points /etc/resolv.conf at the BIND9 it manages
      # (`nameserver 127.0.0.1`), and a bridge-network build cannot reach a
      # resolver on the host's loopback. Docker papers over that for most
      # people — when the host resolver is loopback-only it substitutes public
      # DNS for bridge containers — so a normal install builds fine either way.
      #
      # But asking for host networking makes `docker compose up --build` fail
      # outright on Docker versions where buildx bake enforces the entitlement:
      #   "additional privileges requested: pass --allow=network.host"
      # (issue #37, reported on a clean Ubuntu 24.04 VM). A fresh install is
      # exactly when you build, and at that point this project has not installed
      # BIND yet, so the host resolver is the systemd-resolved stub and Docker's
      # public-DNS substitution applies — i.e. the default needs no special
      # privilege.
      #
      # If you are rebuilding on a host that genuinely needs the host resolver
      # (loopback-only resolv.conf AND no route to public DNS — a
      # restricted-egress deployment), add the override:
      #   docker compose -f docker-compose.yml -f docker-compose.hostnet-build.yml up --build -d
    container_name: open5gs-nms-backend
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /etc/open5gs:/etc/open5gs
      - /var/log/open5gs:/var/log/open5gs
      - /var/log/frr:/var/log/frr:ro
      - /run/systemd/system:/run/systemd/system:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /usr/bin/systemctl:/usr/bin/systemctl:ro
      - /bin/systemctl:/bin/systemctl:ro
      - /lib/systemd:/lib/systemd:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./logs:/var/log/open5gs-nms
      - ./data:/app/data
      - /etc/open5gs/backups/config:/etc/open5gs/backups/config
      - /etc/open5gs/backups/mongodb:/etc/open5gs/backups/mongodb
      - /etc/open5gs/backups/pcap-captures:/etc/open5gs/backups/pcap-captures
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/ue-validation:/tmp/ue-validation
      - ./monitoring:/app/monitoring
      # UE Validation's 4G srsRAN image is built locally (no public image
      # exists) — this is the build context validation-controller.ts uses.
      - ./srsran4g:/app/srsran4g:ro
      - ./genieacs/logs:/var/log/genieacs:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx-sas:ro
    environment:
      - TZ=${TZ:-America/New_York}
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://127.0.0.1:27017/open5gs}
      - BACKUP_PATH=/etc/open5gs/backups/config
      - MONGO_BACKUP_PATH=/etc/open5gs/backups/mongodb
      - LOG_LEVEL=info
      - WS_PORT=3002
      - HOST_SYSTEMCTL_PATH=/usr/bin/systemctl
      - GENIEACS_LOG_HOST_DIR=/DOCKER/open5gs-nms/genieacs/logs
      # Auth
      - AUTH_DB_PATH=/app/data/auth.db
      - SESSION_MAX_AGE=86400
      - FIRST_RUN_PASSWORD=${FIRST_RUN_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Prometheus sync
      - PROMETHEUS_CONFIG_PATH=/app/monitoring/prometheus.yml
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9099}
      # Simlessly eSIM RSP API — get these from the Developer module on your
      # Simlessly account and set them in a .env file (never commit real values)
      - SIMLESSLY_ACCESS_KEY=${SIMLESSLY_ACCESS_KEY:-}
      - SIMLESSLY_SECRET_KEY=${SIMLESSLY_SECRET_KEY:-}
      # Radio Signal page — radio configurations reference this server-side
      # variable by name so the password is never returned to the browser.
      - BAICELLS_RADIO_PASSWORD=${BAICELLS_RADIO_PASSWORD:-}
      - RADIO_CREDENTIALS_KEY=${RADIO_CREDENTIALS_KEY:-}
      # SASBench — the backend reads its REST API server-side, so no SAS
      # credential is ever handed to the browser. These MUST be passed through:
      # without them the backend silently falls back to admin/admin and
      # 127.0.0.1:8094, so setting SAS_ADMIN_PASSWORD in .env (which
      # .env.example tells you to do) would authenticate SASBench's own admin
      # account while leaving the NMS on the default — every SAS read then 401s
      # and the SAS page and dashboard card report the SAS as unreachable while
      # it is in fact running perfectly.
      #
      # SASBENCH_DIR is here because the update flow reads that checkout's git
      # state; it is a HOST path, used via nsenter, not a path in this
      # container.
      - SASBENCH_UI_PORT=${SASBENCH_UI_PORT:-8094}
      - SASBENCH_USER=${SASBENCH_USER:-admin}
      - SAS_ADMIN_PASSWORD=${SAS_ADMIN_PASSWORD:-admin}
      - SASBENCH_DIR=${SASBENCH_DIR:-/opt/sasbench}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,container"
    labels:
      com.open5gs.nms.service: "backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NOTE: build-time host networking is deliberately NOT set here.
      #
      # It used to be (`network: host` under build:), to give the build the
      # host's own resolver. That matters on a deployed host, because this
      # project points /etc/resolv.conf at the BIND9 it manages
      # (`nameserver 127.0.0.1`), and a bridge-network build cannot reach a
      # resolver on the host's loopback. Docker papers over that for most
      # people — when the host resolver is loopback-only it substitutes public
      # DNS for bridge containers — so a normal install builds fine either way.
      #
      # But asking for host networking makes `docker compose up --build` fail
      # outright on Docker versions where buildx bake enforces the entitlement:
      #   "additional privileges requested: pass --allow=network.host"
      # (issue #37, reported on a clean Ubuntu 24.04 VM). A fresh install is
      # exactly when you build, and at that point this project has not installed
      # BIND yet, so the host resolver is the systemd-resolved stub and Docker's
      # public-DNS substitution applies — i.e. the default needs no special
      # privilege.
      #
      # If you are rebuilding on a host that genuinely needs the host resolver
      # (loopback-only resolv.conf AND no route to public DNS — a
      # restricted-egress deployment), add the override:
      #   docker compose -f docker-compose.yml -f docker-compose.hostnet-build.yml up --build -d
      args:
        - VITE_API_URL=
        - VITE_WS_URL=
        - VITE_PROMETHEUS_PORT=${PROMETHEUS_PORT:-9099}
        - VITE_GRAFANA_PORT=${GRAFANA_PORT:-3000}
        - VITE_ENABLE_SMS=${ENABLE_SMS_MODULE:-true}
        - VITE_ENABLE_IMS=${ENABLE_IMS_MODULE:-true}
        - VITE_ENABLE_VALIDATION=${ENABLE_VALIDATION_MODULE:-true}
        - VITE_ENABLE_VOWIFI=${ENABLE_VOWIFI_MODULE:-true}
        - VITE_ENABLE_DNS_MIGRATION=${ENABLE_DNS_MIGRATION_MODULE:-true}
        - VITE_ENABLE_PCAP=${ENABLE_PCAP_MODULE:-true}
        - VITE_ENABLE_PSTN=${ENABLE_PSTN_MODULE:-false}
        - VITE_ENABLE_MMS=${ENABLE_MMS_MODULE:-false}
        - VITE_ENABLE_VECTORCORE_SMSC=${ENABLE_VECTORCORE_SMSC_MODULE:-false}
        - VITE_ENABLE_SECGW=${ENABLE_SECGW_MODULE:-false}
        - VITE_ENABLE_GSM=${ENABLE_GSM_MODULE:-false}
        - VITE_ENABLE_ASTERISK_2G=${ENABLE_ASTERISK_2G_MODULE:-false}
        - VITE_ENABLE_HNBGW=${ENABLE_HNBGW_MODULE:-false}
        - VITE_ENABLE_OCS=${ENABLE_OCS_MODULE:-false}
        - VITE_ENABLE_CDR=${ENABLE_CDR_MODULE:-false}
        - VITE_ENABLE_TWAMP=${ENABLE_TWAMP_MODULE:-false}
        - VITE_ENABLE_RF_PLANNING=${ENABLE_RF_PLANNING_MODULE:-false}
        - VITE_ENABLE_UE_SIGNAL=${ENABLE_UE_SIGNAL_MODULE:-true}
        - VITE_ENABLE_SNMP=${ENABLE_SNMP_MODULE:-false}
    container_name: open5gs-nms-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,container"
    labels:
      com.open5gs.nms.service: "frontend"

  monitoring-init:
    image: busybox:latest
    container_name: open5gs-monitoring-init
    restart: "no"
    network_mode: host
    user: root
    command:
      - /bin/sh
      - -c
      - |
        chown -R 65534:65534 /prometheus_data
        chown -R 472:472 /grafana_data
        echo "Monitoring data directories initialised"
    volumes:
      - ./monitoring/prometheus_data:/prometheus_data
      - ./monitoring/grafana_data:/grafana_data

  prometheus:
    image: prom/prometheus:latest
    container_name: open5gs-prometheus
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=0.0.0.0:${PROMETHEUS_PORT:-9099}'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring:/etc/prometheus
      - ./monitoring/prometheus_data:/prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.open5gs.nms.service: "prometheus"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: open5gs-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-open5gs}
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3000}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana_data:/var/lib/grafana
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.open5gs.nms.service: "grafana"

  cert-init:
    image: alpine/openssl
    container_name: open5gs-cert-init
    restart: "no"
    network_mode: host
    volumes:
      - ./nginx/certs:/certs
      - ./nginx/setup-nginx-certs.sh:/generate-cert.sh:ro
    entrypoint: ["/bin/sh", "/generate-cert.sh"]
    labels:
      com.open5gs.nms.service: "cert-init"

  genieacs-init:
    image: busybox:latest
    container_name: genieacs-init
    restart: "no"
    network_mode: host
    user: root
    command:
      - /bin/sh
      - -c
      - |
        chown -R 999:999 /genieacs_logs
        chown -R 999:999 /genieacs_ext
        echo "GenieACS directories initialised"
    volumes:
      - ./genieacs/logs:/genieacs_logs
      - ./genieacs/ext:/genieacs_ext

  # ─────────────────────────────────────────────────────────
  # GenieACS — TR-069 Auto Configuration Server
  # CWMP (TR-069):  port 7547  ← CPEs/femtocells connect here
  # NBI (REST API): port 7557
  # FS (File srv):  port 7567
  # UI (Web UI):    port 7000
  # MongoDB DB:     genieacs   ← isolated from open5gs DB
  # ─────────────────────────────────────────────────────────
  genieacs:
    image: drumsergio/genieacs:latest
    container_name: genieacs
    restart: unless-stopped
    network_mode: host
    depends_on:
      genieacs-init:
        condition: service_completed_successfully
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=${GENIEACS_MONGODB_CONNECTION_URL:-mongodb://127.0.0.1:27017/genieacs}
      - GENIEACS_UI_JWT_SECRET=${GENIEACS_UI_JWT_SECRET:-changeme_set_in_env}
      - GENIEACS_CWMP_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-cwmp-access.log
      - GENIEACS_NBI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-nbi-access.log
      - GENIEACS_FS_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-fs-access.log
      - GENIEACS_UI_ACCESS_LOG_FILE=/var/log/genieacs/genieacs-ui-access.log
      - GENIEACS_DEBUG_FILE=/var/log/genieacs/genieacs-debug.yaml
      - GENIEACS_UI_PORT=${GENIEACS_UI_PORT:-7000}
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    volumes:
      - ./genieacs/ext:/opt/genieacs/ext
      - ./genieacs/logs:/var/log/genieacs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      com.open5gs.nms.service: "genieacs"

  # ─────────────────────────────────────────────────────────
  # SASBench — the CBRS Spectrum Access System (WINNF-TS-0016)
  #
  # This is the SAS. The NMS does not implement one: SASBench owns the
  # SAS-CBSD protocol ports and binds them itself, so radios connect to it
  # directly. Nothing in this stack proxies, terminates TLS for, or rewrites
  # that traffic — deliberately, so what SASBench logs is what the radio sent,
  # from the address it really came from.
  #
  #   SAS_HTTP_PORT   (8899) ← CBSD protocol, plain HTTP
  #   SAS_HTTPS_PORT  (8443) ← CBSD protocol, HTTPS / mutual TLS
  #   SASBENCH_UI_PORT(8094) ← SASBench admin UI + REST API (/api/v1)
  #
  # 8094 rather than SASBench's own default of 8080: PyHSS already binds
  # 127.0.0.1:8080 on this host (same collision SigScale OCS hit — see
  # CLAUDE.md architectural pattern #17).
  #
  # The build context lives OUTSIDE this repository (SASBENCH_DIR, default
  # /opt/sasbench) and must stay there: SASBench is proprietary, this project
  # is AGPL-3.0, so its source must never be vendored in here. Clone it to
  # that path before the first `docker compose up` — see INSTALL.md.
  # ─────────────────────────────────────────────────────────
  sasbench:
    # Behind a profile so a missing SASBENCH_DIR cannot take the stack down.
    #
    # This service's build context is a checkout OUTSIDE this repository, and
    # Compose resolves every build context before it starts anything: if the
    # directory is absent, `docker compose up -d` fails in the build phase and
    # NOT ONE service starts — verified, including the containers that have
    # nothing to do with the SAS. That turns a `git pull` on a deployment
    # predating SASBench into a total outage with no UI left to explain it.
    #
    # With the profile, a plain `up -d` skips this service and the rest of the
    # stack comes up normally; the NMS then detects the missing checkout and
    # tells the operator what to do (module-fixall-usecase.ts's sasbench
    # entry). Set COMPOSE_PROFILES=sas in .env to run it — .env.example ships
    # that way, so a fresh install gets the SAS with no extra step, while an
    # existing .env without the line is protected by default.
    #
    # Naming a service explicitly auto-enables its profile, so the NMS's own
    # update flow (`docker compose build sasbench` / `up -d sasbench` in
    # sas-controller.ts) keeps working whether or not the profile is active.
    profiles: ["sas"]
    build:
      context: ${SASBENCH_DIR:-/opt/sasbench}
    image: sasbench:latest
    container_name: sasbench
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: "UTC"
      UI_PORT: ${SASBENCH_UI_PORT:-8094}
      SAS_HTTP_PORT: ${SAS_HTTP_PORT:-8899}
      SAS_HTTPS_PORT: ${SAS_HTTPS_PORT:-8443}
      # lab is required here, not a preference — see .env.example. winnforum
      # sets tlsClientAuth=require and acceptVersionlessPaths=false, either of
      # which drops every radio on this deployment the moment it is applied.
      SAS_PROFILE: ${SAS_PROFILE:-lab}
      SAS_PROFILE_APPLY: ${SAS_PROFILE_APPLY:-}
      SAS_FQDN: ${SAS_FQDN:-}
      SAS_BIND_IP: ${SAS_BIND_IP:-}
      SAS_HOSTNAMES: ${SAS_HOSTNAMES:-}
      SAS_ADMIN_PASSWORD: ${SAS_ADMIN_PASSWORD:-}
      SAS_AUTH: ${SAS_AUTH:-}
      SAS_API_CORS_ORIGINS: ${SAS_API_CORS_ORIGINS:-}
    volumes:
      - sas-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      com.open5gs.nms.service: "sasbench"

volumes:
  # SASBench's SQLite database, its own PKI, terrain and map tiles. A named
  # volume, not a bind mount: it holds the SAS's live grant state and private
  # keys, which must never land inside the repository working tree.
  sas-data:
