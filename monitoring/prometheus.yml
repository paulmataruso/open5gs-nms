# ─────────────────────────────────────────────────────────────────────
# Prometheus configuration for Open5GS NMS
# PARTLY AUTO-GENERATED. The NMS regenerates its own open5gs-*,
# open5gs-nms-backend, pyhss-metrics and vectorcore-*-metrics jobs
# whenever metrics endpoints change — edits to those are overwritten.
# Any OTHER scrape job you add here, and the global: block below, are
# preserved across regeneration.
# To change an NMS-owned job, use the Metrics Endpoints page in the UI.
# ─────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:

  - job_name: open5gs-amf
    static_configs:
      - targets: ['127.0.0.5:9090']
        labels:
          nf: amf
          generation: 5g

  - job_name: open5gs-smf
    static_configs:
      - targets: ['127.0.0.4:9090']
        labels:
          nf: smf
          generation: 5g

  - job_name: open5gs-upf
    static_configs:
      - targets: ['127.0.0.7:9090']
        labels:
          nf: upf
          generation: 5g

  - job_name: open5gs-pcf
    static_configs:
      - targets: ['127.0.0.13:9090']
        labels:
          nf: pcf
          generation: 5g

  - job_name: open5gs-mme
    static_configs:
      - targets: ['127.0.0.2:9090']
        labels:
          nf: mme
          generation: 4g

  - job_name: open5gs-hss
    static_configs:
      - targets: ['127.0.0.8:9090']
        labels:
          nf: hss
          generation: 4g

  - job_name: open5gs-pcrf
    static_configs:
      - targets: ['127.0.0.9:9090']
        labels:
          nf: pcrf
          generation: 4g

  - job_name: open5gs-nms-backend
    static_configs:
      - targets: ['127.0.0.1:3001']
        labels:
          nf: nms-backend

  - job_name: pyhss-metrics
    static_configs:
      - targets: ['127.0.1.11:9191']
        labels:
          nf: pyhss
          generation: ims

  - job_name: vectorcore-smsc-metrics
    static_configs:
      - targets: ['127.0.0.1:8092']
        labels:
          nf: vectorcore-smsc
          generation: sms

  - job_name: vectorcore-mmsc-metrics
    static_configs:
      - targets: ['127.0.0.1:8090']
        labels:
          nf: vectorcore-mmsc
          generation: mms
