upstream backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# WebSocket now runs on the same port as the HTTP backend (3001).
# Authentication is enforced server-side on the upgrade request.
# The separate port 3002 is no longer used.
upstream websocket {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream frontend {
    server 127.0.0.1:8081;
    keepalive 32;
}


# ── HTTP server (NMS web UI) ──────────────────────────────────────────────────
# The CBRS SAS is SASBench, a separate container that binds the SAS-CBSD
# protocol ports itself (SAS_HTTP_PORT / SAS_HTTPS_PORT in .env). nginx is not
# in that path at all — do not add a /sas/ location here.
server {
    listen 80;
    listen 8888;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;

    location /ws {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/femto/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     700s;
        proxy_send_timeout     700s;
        client_max_body_size 1m;
    }

    # Source builds — FRR (fresh install via the migration wizard, or the standalone
    # "Reinstall (Source)" tool), Kamailio 6.0.8, and rtpengine — can run for many
    # minutes — the default 120s proxy
    # timeouts below would otherwise cut the streamed response mid-build even though the
    # underlying host build (spawned via nsenter) keeps running regardless.
    # Kamailio and rtpengine were missing here until 2026-10-10: their /log/stream
    # endpoints are long-lived chunked responses (the real ~9-minute Kamailio build is
    # watched through one), so the generic /api/ location below was silently cutting the
    # live build log every 120s and surfacing it in the browser as a network error.
    location ~ ^/api/(frr/(migration/install-frr|source-build)|kamailio/source-build|rtpengine/source-build) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     1800s;
        proxy_send_timeout     1800s;
        client_max_body_size 10m;
    }

    # Streaming install/uninstall endpoints for optional modules (IMS, SMS, VoWiFi, BIND,
    # chrony, syslog, SWu emulator) — these run real apt-get installs (kamailio,
    # mariadb-server, PyHSS via git clone, etc.) that can go quiet for well over the
    # default 120s below on a fresh host, especially if DNS resolution is at all slow —
    # same class of bug as FRR source-build above, just never given the same fix. Without
    # this, nginx silently kills the connection mid-install and the browser sees a generic
    # "network error", even though the underlying host install (spawned via nsenter) keeps
    # running regardless.
    # /api/sas/update used to be here too, because it rebuilt SASBench's image and
    # streamed minutes of output. That route is gone: SASBench's revision is pinned by
    # the NMS release, so it is updated by moving the pin and pulling, never from the UI.
    location ~ ^/api/(ims|sms|gsm|mms|vectorcore-smsc|vowifi|secgw|bind|chrony|syslog|swu-emulator|twamp|snmp|asterisk-2g|hnbgw|ocs|pstn)/(install|uninstall|remove) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     1800s;
        proxy_send_timeout     1800s;
        client_max_body_size 10m;
    }

    # VoLTE/VoWiFi E2E validation tests — stream one NDJSON line per step (register,
    # call, answer, verify RTP, hang up — VoWiFi's also establishes/tears down a real
    # IPsec tunnel first), each step has its own internal timeout (max ~30s), but the
    # default 120s below is still tight with no margin. Same streaming-response class
    # of endpoint as the block above, smaller timeout since this never runs a package
    # install (VoWiFi's tunnel setup can pull in linphone-cli via apt, same as VoLTE's).
    location ~ ^/api/validation/(volte|vowifi)/run {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }

    # QCI/dedicated-bearer validation test — same streaming NDJSON-per-step class as the
    # block above, but this one can first-time-build the srsRAN validation image from
    # source (confirmed live at ~22 minutes on an 8-core host with a cold Docker layer
    # cache, see dockerBuild()'s own comment in validation-controller.ts), and the backend
    # sends no bytes at all for the whole duration of that build — the 300s timeout above
    # would kill the connection long before it finishes. Real bug found live: the backend
    # kept running to completion (confirmed via MME's own S1AP log showing a real UE
    # attach well after the browser had already errored out), but the browser's stream
    # reader threw once nginx closed the idle connection, surfacing as a generic
    # "Error in input stream" with no useful indication of what actually happened.
    location ~ ^/api/validation/qci/run {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     1800s;
        proxy_send_timeout     1800s;
    }

    # Packet capture download/decode endpoints — downloading a large .pcapng or
    # running tshark's own decode pass against one (packets/summary) can exceed
    # the generic 120s timeout below, especially on a slow connection or a
    # multi-hundred-MB capture. Same class of override as the two blocks above.
    location ~ ^/api/pcap/captures/.+/(download|packets|summary) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }

    # RF Planning's OSM building import calls Overpass, donated public
    # infrastructure whose latency is not ours to control — measured
    # 2026-10-13, one mirror answered in 6s while another 504'd after 119s.
    # The generic 120s timeout below turned a slow mirror into a bare 504 in
    # the browser, discarding the backend's own error envelope (and its hedged
    # retry across the other mirrors) before it could be returned. The backend
    # caps its whole mirror sequence at 150s, so this only has to be loose
    # enough not to cut that short; it is a ceiling, not an expected duration.
    location = /api/rf-planning/buildings/import {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── HTTPS CWMP proxy for Sercomm factory-default ACS URL ─────────────────────
# Port 443 — factory-reset Sercomm radios connect to https://acs.sc.sercomm.com
# DNS hijack points acs.sc.sercomm.com to this host; TLS terminates here,
# CWMP traffic is forwarded to GenieACS on port 7547 (plain HTTP).
server {
    listen 443 ssl;
    server_name acs.sc.sercomm.com;

    ssl_certificate     /etc/nginx/certs/acs.crt;
    ssl_certificate_key /etc/nginx/certs/acs.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ACS:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/acs-access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://127.0.0.1:7547;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_max_body_size  10m;
    }
}
